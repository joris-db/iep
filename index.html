<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IEP Oefentoets Taalverzorging - Schone Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        .card { background: white; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .option-btn { border: 2px solid #e2e8f0; transition: all 0.2s; cursor: pointer; text-align: left; width: 100%; padding: 1.25rem; border-radius: 12px; background: white; margin-bottom: 0.75rem; position: relative; }
        .option-btn:hover { border-color: #3b82f6; background-color: #f8fafc; transform: translateY(-1px); }
        .option-selected { border-color: #3b82f6 !important; background-color: #eff6ff !important; box-shadow: inset 4px 0 0 #3b82f6; }
        .progress-bar { height: 12px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); transition: width 0.4s ease; }
        .sticky-footer { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-top: 1px solid #e2e8f0; padding: 1.25rem; z-index: 50; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .unanswered-alert { border: 2px solid #ef4444 !important; animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="p-4 md:p-8 pb-32">
    <div class="max-w-4xl mx-auto">
        <!-- Startscherm -->
        <div id="setup-container" class="card p-8 md:p-12 text-center border-t-8 border-blue-600">
            <div class="w-20 h-20 bg-blue-600 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg">
                <span class="text-white text-4xl font-bold">IEP</span>
            </div>
            <h1 class="text-4xl font-extrabold text-slate-800 mb-4">Taalverzorging Oefenportaal</h1>
            <p class="text-slate-500 text-lg mb-10">Kies je niveau. Elke toets bevat 30 unieke vragen uit onze database.</p>
            
            <div class="max-w-md mx-auto space-y-6 text-left mb-10">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Naam leerling</label>
                    <input type="text" id="student-name" class="w-full p-4 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:outline-none transition-colors" placeholder="Vul je naam in">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Kies leerjaar</label>
                    <select id="grade-select" class="w-full p-4 border-2 border-slate-200 rounded-xl bg-white focus:border-blue-500 focus:outline-none appearance-none cursor-pointer">
                        <option value="L6">Leerjaar 6 (0F/1F)</option>
                        <option value="L7">Leerjaar 7 (1F)</option>
                        <option value="L8_1F2F">Leerjaar 8 (1F-2F)</option>
                        <option value="L8_3F">Leerjaar 8 (3F)</option>
                    </select>
                </div>
            </div>

            <button onclick="startQuiz()" class="w-full max-w-md bg-blue-600 text-white px-8 py-4 rounded-xl hover:bg-blue-700 font-bold text-xl transition-all shadow-xl shadow-blue-100">
                Start de Toets
            </button>
        </div>

        <!-- Quiz Interface -->
        <div id="quiz-ui" class="hidden space-y-6">
            <div class="card p-6 sticky top-4 z-40 border-b-4 border-blue-500">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                    <div>
                        <h2 id="display-name" class="text-2xl font-bold text-slate-800"></h2>
                        <span id="display-grade" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-bold uppercase tracking-wider"></span>
                    </div>
                    <div class="text-right">
                        <span class="text-slate-400 text-sm font-medium">Voortgang</span>
                        <div class="text-2xl font-black text-blue-600"><span id="progress-text">0</span><span class="text-slate-300 font-light mx-1">/</span>30</div>
                    </div>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill w-0"></div>
                </div>
            </div>
            
            <div id="quiz-container" class="space-y-6"></div>
        </div>

        <!-- Resultaten -->
        <div id="final-result" class="hidden card p-12 text-center">
            <div id="result-icon" class="w-24 h-24 rounded-full mx-auto mb-6 flex items-center justify-center text-3xl font-bold"></div>
            <h2 id="result-title" class="text-4xl font-black mb-2"></h2>
            <p id="final-score-text" class="text-2xl text-slate-600 mb-10"></p>
            
            <div id="wrong-answers-review" class="text-left mb-10 hidden">
                <h3 class="text-xl font-bold text-slate-800 mb-4">Verbeterpunten:</h3>
                <div class="space-y-3 max-h-96 overflow-y-auto pr-2" id="wrong-list"></div>
            </div>
            
            <button onclick="location.reload()" class="bg-slate-800 text-white px-10 py-4 rounded-xl hover:bg-slate-900 font-bold transition-all">
                Nieuwe Toets Starten
            </button>
        </div>
    </div>

    <div id="sticky-submit" class="sticky-footer hidden">
        <div class="max-w-4xl mx-auto flex justify-end">
            <button onclick="validateAndSubmit()" class="w-full md:w-auto bg-green-600 text-white px-14 py-4 rounded-xl hover:bg-green-700 font-black text-lg shadow-lg transition-all">
                Toets Nu Inleveren
            </button>
        </div>
    </div>

    <script>
        const questionsDB = { "L6": [], "L7": [], "L8_1F2F": [], "L8_3F": [] };

        function generateDatabase() {
            const levels = ["L6", "L7", "L8_1F2F", "L8_3F"];
            
            levels.forEach(lvl => {
                // 1. SPELLING - 35 UNIEKE WOORDEN
                const spellingBase = [
                    ["pinguïn", "pinguin", "pingwin"], ["taxi's", "taxis", "taxi-s"], ["onmiddellijk", "onmiddelijk", "onmidellijk"],
                    ["enthousiast", "entousiast", "entousast"], ["verrassing", "verassing", "verrassing"], ["cadeautje", "kadootje", "kadeautje"],
                    ["bibliotheek", "biebliotheek", "biblotek"], ["elektriciteit", "electriciteit", "elektricitijd"], ["abonnement", "abbonnement", "abonement"],
                    ["labyrint", "labirint", "laberint"], ["barbecue", "barbeque", "barbecu"], ["portemonnee", "portemonee", "portemenee"],
                    ["claxonneren", "claxoneren", "klaxonneren"], ["exclusief", "exclussief", "ecklusief"], ["geüpload", "geupload", "ge-upload"],
                    ["hygiëne", "hygiene", "higyene"], ["initiatief", "inisjatief", "initiatief"], ["juweeltje", "juweltje", "juweeltje"],
                    ["kopiëren", "kopieren", "kopiëren"], ["luxueus", "luxueus", "luxieus"], ["mannequin", "mannekin", "mannekijn"],
                    ["notities", "notities", "notitie's"], ["officieel", "officieel", "oficieel"], ["parallel", "parellel", "paralel"],
                    ["quarantaine", "karantaine", "quarantene"], ["broccoli", "brocoli", "brocolli"], ["caissière", "caissiere", "kassiere"],
                    ["dichtstbijzijnde", "dichtbijzijnde", "dichtsbijzijnde"], ["faillissement", "faliet", "faillisement"], ["gefeliciteerd", "gefelisiteerd", "geveliciteerd"],
                    ["hardnekkig", "hartnekkig", "hardnekig"], ["ijverig", "ijverreg", "yverig"], ["jaloers", "jaloersh", "jallours"],
                    ["kolossaal", "kolosaal", "kollossaal"], ["litteken", "liteken", "liedteken"]
                ];

                spellingBase.forEach(item => {
                    questionsDB[lvl].push({
                        instr: "Spelling",
                        q: "Welk woord is correct gespeld?",
                        options: [item[0], item[1], item[2]],
                        correct: item[0]
                    });
                });

                // 2. WERKWOORDEN - 35 UNIEKE ZINNEN
                const wwBase = [
                    ["Hij ... elke ochtend een broodje.", "eet", "eet", "eet"],
                    ["De kinderen ... gisteren in de speeltuin.", "speelden", "speelde", "speelden"],
                    ["Ik heb mijn huiswerk gisteren ...", "gemaakt", "maakte", "gemaakt"],
                    ["... jij straks ook mee naar de stad?", "Ga", "Ga", "Gaat"],
                    ["Mijn broer ... vroeger veel strips.", "las", "leest", "las"],
                    ["Wij hebben de hele middag ...", "gevoetbald", "voetbalden", "gevoetbald"],
                    ["De politie ... de dief direct.", "pakte", "pakt", "pakte"],
                    ["Morgen ... we een belangrijke toets.", "maken", "maken", "maakt"],
                    ["Zij ... dat ze gisteren ziek was.", "zei", "zei", "zegde"],
                    ["Mijn ouders ... een nieuw huis.", "kochten", "kochten", "kocht"],
                    ["Wie ... de laatste koekjes?", "heeft", "heeft", "hebben"],
                    ["De vogel ... hoog in de lucht.", "vliegt", "vliegt", "vliegd"],
                    ["Wij ... netjes op onze beurt.", "wachten", "wachten", "wachtte"],
                    ["Heb jij de brief al ...?", "verstuurd", "verstuurd", "verstuurdt"],
                    ["De zon ... fel op het strand.", "scheen", "scheen", "schijnt"],
                    ["Ik ... gisteren een uur te laat.", "was", "was", "ben"],
                    ["Jullie ... erg hard gelachen.", "hebben", "hebben", "heeft"],
                    ["De leraar ... de sommen uit.", "legt", "legt", "leigt"],
                    ["... u mij de weg kunnen wijzen?", "Zou", "Zou", "Zoud"],
                    ["Hij ... de bal in de ring.", "gooit", "gooit", "gooid"],
                    ["Wij ... morgen naar Parijs.", "vertrekken", "vertrekken", "vertrekt"],
                    ["Het meisje ... om haar verloren pop.", "huilt", "huilt", "huijlt"],
                    ["Gisteren ... het de hele dag.", "regende", "regende", "regende"],
                    ["Hebben jullie de tekst al ...?", "gelezen", "gelezen", "leest"],
                    ["Mijn oma ... vroeger in deze fabriek.", "werkte", "werkte", "werkten"],
                    ["De kat ... rustig in de mand.", "sliep", "sliep", "slaapt"],
                    ["... je gisteren nog tv?", "Keek", "Keek", "Kijkt"],
                    ["Wij ... vrolijk een liedje.", "zingen", "zingen", "zingt"],
                    ["De auto ... tegen een boom.", "botste", "botste", "botste"],
                    ["Hij ... zijn kamer gisteren op.", "ruimde", "ruimde", "ruimt"],
                    ["Zij ... een mooie tekening voor mij.", "maakte", "maakte", "maakt"],
                    ["Het ijsje ... erg lekker.", "smaakte", "smaakte", "smaakt"],
                    ["Ik ... nog nooit in Londen geweest.", "ben", "ben", "was"],
                    ["Wij ... elkaar op het plein.", "ontmoetten", "ontmoetten", "ontmoette"],
                    ["De baby ... de hele nacht door.", "sliep", "sliep", "slaapt"]
                ];

                wwBase.forEach(item => {
                    questionsDB[lvl].push({
                        instr: "Werkwoorden",
                        q: item[0],
                        options: [item[2], item[3], "geen van beide"],
                        correct: item[1]
                    });
                });

                // 3. INTERPUNCTIE & GRAMMATICA - 30 UNIEKE ITEMS
                const extraBase = [
                    ["Interpunctie", "Waar moet de komma staan?", "Hoewel het hard regende, gingen we toch wandelen.", "na 'regende'", "na 'gingen'", "nergens"],
                    ["Grammatica", "Wat is het onderwerp in: 'De oude man loopt met een stok'?", "De oude man", "De oude man", "loopt", "stok"],
                    ["Interpunctie", "Kies de zin met de juiste leestekens.", "Mama riep: \"Kom je eten?\"", "Mama riep: \"Kom je eten?\"", "Mama riep: Kom je eten?", "\"Mama riep: Kom je eten?\""],
                    ["Grammatica", "Wat is de persoonsvorm in: 'De kinderen spelen buiten'?", "spelen", "spelen", "De kinderen", "buiten"],
                    ["Interpunctie", "Waar moet het vraagteken staan?", "Vraag je je af of het morgen gaat sneeuwen?", "aan het eind", "na 'af'", "nergens"],
                    ["Grammatica", "Zoek het bijvoeglijk naamwoord: 'De rode appel is erg zoet.'", "rode", "rode", "appel", "zoet"],
                    ["Interpunctie", "Welke zin is correct?", "Hij zei: \"Ik ga naar huis.\"", "Hij zei: \"Ik ga naar huis.\"", "Hij zei \"Ik ga naar huis.\"", "Hij zei: Ik ga naar huis."],
                    ["Grammatica", "Wat is het lijdend voorwerp in: 'Jan eet een appel'?", "een appel", "een appel", "Jan", "eet"],
                    ["Interpunctie", "Waar moet de punt staan?", "De lessen beginnen om half negen.", "aan het eind", "na 'half'", "na 'lessen'"],
                    ["Grammatica", "Wat is het hele werkwoord van 'hij zingt'?", "zingen", "zingen", "zing", "zongen"],
                    ["Interpunctie", "Kies de juiste zin.", "Parijs, de hoofdstad van Frankrijk, is erg mooi.", "Parijs, de hoofdstad van Frankrijk, is erg mooi.", "Parijs de hoofdstad van Frankrijk is erg mooi.", "Parijs de hoofdstad, van Frankrijk is erg mooi."],
                    ["Grammatica", "Wat is het meervoud van 'schip'?", "schepen", "schepen", "schips", "schipen"],
                    ["Interpunctie", "Welke afkorting is goed?", "enz.", "enz.", "enz", "en.z."],
                    ["Grammatica", "Wat is het voltooid deelwoord in: 'Ik heb een film gekeken'?", "gekeken", "gekeken", "heb", "film"],
                    ["Interpunctie", "Waar moet de dubbele punt staan?", "Ik koop drie dingen: melk, brood en boter.", "na 'dingen'", "na 'koop'", "na 'melk'"],
                    ["Grammatica", "Wat is de stam van 'antwoorden'?", "antwoord", "antwoord", "antwoorde", "antwoort"],
                    ["Interpunctie", "Welke zin is goed?", "Ik ben 's middags vaak moe.", "Ik ben 's middags vaak moe.", "Ik ben s'middags vaak moe.", "Ik ben smiddags vaak moe."],
                    ["Grammatica", "Wat is een eigennaam?", "Rotterdam", "Rotterdam", "stad", "groot"],
                    ["Interpunctie", "Kies de juiste schrijfwijze.", "café", "café", "cafe", "cáfe"],
                    ["Grammatica", "Wat is het bezittelijk voornaamwoord?", "mijn", "mijn", "ik", "de"],
                    ["Interpunctie", "Kies de juiste zin.", "Help, er zit een spin in mijn nek!", "Help, er zit een spin in mijn nek!", "Help er zit een spin in mijn nek", "Help! er zit een spin in mijn nek"],
                    ["Grammatica", "Wat is het stoffelijk bijvoeglijk naamwoord?", "gouden", "gouden", "goud", "geel"],
                    ["Interpunctie", "Kies de juiste zin.", "Het is vandaag 14 januari 2026.", "Het is vandaag 14 januari 2026.", "Het is vandaag 14-januari-2026.", "Het is vandaag 14, januari 2026."],
                    ["Grammatica", "Zoek de persoonsvorm: 'Gisteren liep ik in het bos.'", "liep", "liep", "gisteren", "bos"],
                    ["Interpunctie", "Kies de juiste zin.", "Ben je klaar? Dan kunnen we gaan.", "Ben je klaar? Dan kunnen we gaan.", "Ben je klaar, dan kunnen we gaan.", "Ben je klaar dan kunnen we gaan?"],
                    ["Grammatica", "Wat is het onderwerp: 'Heeft hij de toets gehaald?'", "hij", "hij", "de toets", "gehaald"],
                    ["Interpunctie", "Kies de juiste zin.", "Ik heb een rode, blauwe en groene pen.", "Ik heb een rode, blauwe en groene pen.", "Ik heb een rode blauwe en groene pen.", "Ik heb een rode, blauwe, en groene pen."],
                    ["Grammatica", "Wat is een lidwoord?", "het", "het", "is", "een"],
                    ["Interpunctie", "Welke zin is goed?", "Hij vroeg: \"Hoe gaat het?\"", "Hij vroeg: \"Hoe gaat het?\"", "Hij vroeg \"Hoe gaat het?\"", "Hij vroeg: Hoe gaat het?"],
                    ["Grammatica", "Wat is de verleden tijd van 'vinden'?", "vond", "vond", "vinde", "gevonden"]
                ];

                extraBase.forEach(item => {
                    questionsDB[lvl].push({
                        instr: item[0],
                        q: item[1],
                        options: [item[3], item[4], item[5]],
                        correct: item[2]
                    });
                });
            });
        }

        generateDatabase();

        let activeQuestions = [];
        let userAnswers = {};

        function shuffle(array) {
            let cur = array.length, rand;
            while (cur != 0) {
                rand = Math.floor(Math.random() * cur);
                cur--;
                [array[cur], array[rand]] = [array[rand], array[cur]];
            }
            return array;
        }

        function startQuiz() {
            const name = document.getElementById('student-name').value.trim();
            const level = document.getElementById('grade-select').value;
            if (name.length < 2) {
                document.getElementById('student-name').classList.add('border-red-500');
                return;
            }

            document.getElementById('display-name').innerText = name;
            document.getElementById('display-grade').innerText = document.getElementById('grade-select').options[document.getElementById('grade-select').selectedIndex].text;
            document.getElementById('setup-container').classList.add('hidden');
            document.getElementById('quiz-ui').classList.remove('hidden');
            document.getElementById('sticky-submit').classList.remove('hidden');

            activeQuestions = shuffle([...questionsDB[level]]).slice(0, 30);
            renderQuestions();
            window.scrollTo(0,0);
        }

        function renderQuestions() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            
            activeQuestions.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'card p-8 mb-6 border-2 border-transparent transition-all';
                card.id = `q-card-${idx}`;
                
                const opts = shuffle([...item.options]);
                
                card.innerHTML = `
                    <div class="flex items-center gap-3 mb-4">
                        <span class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm">${idx + 1}</span>
                        <span class="text-xs font-black text-slate-400 uppercase tracking-widest">${item.instr}</span>
                    </div>
                    <p class="text-xl font-bold text-slate-800 mb-6">${item.q}</p>
                    <div class="grid grid-cols-1 gap-3">
                        ${opts.map(opt => `
                            <button onclick="selectAnswer(${idx}, '${opt.replace(/'/g, "\\'")}')" 
                                    class="option-btn" 
                                    data-q="${idx}" 
                                    data-val="${opt}">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.selectAnswer = (qIdx, val) => {
            userAnswers[qIdx] = val;
            document.querySelectorAll(`button[data-q="${qIdx}"]`).forEach(b => {
                b.classList.remove('option-selected');
                if(b.getAttribute('data-val') === val) b.classList.add('option-selected');
            });
            document.getElementById(`q-card-${qIdx}`).classList.remove('unanswered-alert');
            const count = Object.keys(userAnswers).length;
            document.getElementById('progress-text').innerText = count;
            document.getElementById('progress-fill').style.width = (count / 30 * 100) + '%';
        };

        function validateAndSubmit() {
            let missing = [];
            for(let i=0; i<30; i++) if(!userAnswers[i]) missing.push(i);

            if(missing.length > 0) {
                missing.forEach(i => document.getElementById(`q-card-${i}`).classList.add('unanswered-alert'));
                document.getElementById(`q-card-${missing[0]}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            let score = 0;
            const wrongList = document.getElementById('wrong-list');
            wrongList.innerHTML = '';

            activeQuestions.forEach((q, i) => {
                if(userAnswers[i] === q.correct) score++;
                else {
                    const div = document.createElement('div');
                    div.className = 'p-4 bg-slate-50 border-l-4 border-amber-400 rounded-r-lg text-sm';
                    div.innerHTML = `<p class="font-bold">${q.q}</p><p class="text-red-500">Jouw antwoord: ${userAnswers[i]}</p><p class="text-green-600">Correct: ${q.correct}</p>`;
                    wrongList.appendChild(div);
                }
            });

            document.getElementById('quiz-ui').classList.add('hidden');
            document.getElementById('sticky-submit').classList.add('hidden');
            document.getElementById('final-result').classList.remove('hidden');
            document.getElementById('final-score-text').innerText = `Je hebt ${score} van de 30 vragen goed!`;
            
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            if(score >= 24) { 
                icon.className += " bg-green-100 text-green-600"; icon.innerHTML = '✓'; title.innerText = "Geweldig!"; 
            } else if(score >= 17) { 
                icon.className += " bg-blue-100 text-blue-600"; icon.innerHTML = '★'; title.innerText = "Goed gedaan!"; 
            } else { 
                icon.className += " bg-amber-100 text-amber-600"; icon.innerHTML = '!'; title.innerText = "Nog even oefenen!"; 
            }
            
            if(score < 30) document.getElementById('wrong-answers-review').classList.remove('hidden');
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>

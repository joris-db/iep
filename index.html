<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IEP Toets Taalverzorging Groep 6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { scroll-behavior: smooth; }
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .question-card { transition: all 0.3s ease; border-left-width: 8px; }
        .hidden { display: none; }
        
        .status-open { border-left-color: #e2e8f0; }
        .status-wrong { background-color: #fee2e2; border-left-color: #ef4444; }
        .status-correct { background-color: #f0fdf4; border-left-color: #22c55e; }
        .status-retry { background-color: #fff7ed; border-left-color: #f97316; }
        
        .stat-bar { height: 12px; border-radius: 6px; background: #e5e7eb; overflow: hidden; }
        .stat-fill { height: 100%; transition: width 1s ease-out; }
        
        .answer-opt { cursor: pointer; position: relative; z-index: 10; }
        .answer-opt:disabled { cursor: not-allowed; opacity: 0.6; }
        
        @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .pop-in { animation: popIn 0.3s ease-out; }
    </style>
</head>
<body class="p-4 md:p-8">

<div id="app" class="max-w-4xl mx-auto bg-white shadow-2xl rounded-3xl overflow-hidden">
    <!-- Header -->
    <header class="bg-sky-600 p-8 text-white text-center">
        <h1 class="text-3xl font-black italic mb-2 tracking-tight">IEP TOETS TAAL</h1>
        <div class="inline-block bg-sky-500 px-4 py-1 rounded-full text-sm font-bold uppercase tracking-widest">Groep 6</div>
    </header>

    <!-- Start Scherm -->
    <div id="start-screen" class="p-10 text-center">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Welkom bij de oefentoets!</h2>
            <label class="block text-gray-600 font-medium mb-3">Hoe heet je?</label>
            <input type="text" id="student-name" class="w-full md:w-96 p-5 border-2 border-gray-200 rounded-2xl focus:border-sky-500 focus:outline-none text-center text-2xl font-bold text-gray-700 shadow-inner" placeholder="Je naam hier...">
        </div>
        <button onclick="startTest()" class="bg-sky-600 hover:bg-sky-700 text-white font-black py-5 px-16 rounded-2xl transition duration-300 transform hover:scale-105 shadow-xl text-xl uppercase">
            Start de Toets
        </button>
    </div>

    <!-- Quiz Scherm -->
    <div id="quiz-screen" class="hidden">
        <div class="bg-white/90 backdrop-blur-sm p-4 sticky top-0 z-50 shadow-md border-b border-gray-100">
            <div class="max-w-2xl mx-auto">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-black text-gray-500 uppercase">Jouw voortgang</span>
                    <span id="progress-text" class="text-sm font-black text-sky-600">0 / 40</span>
                </div>
                <div class="bg-gray-100 h-4 w-full rounded-full overflow-hidden border border-gray-200">
                    <div id="progress-bar" class="bg-sky-500 h-full w-0 transition-all duration-500 shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)]"></div>
                </div>
            </div>
        </div>

        <div id="questions-container" class="p-6 space-y-12 bg-slate-50 pb-40">
            <!-- Vragen via JS -->
        </div>

        <!-- Sticky Footer for Submit -->
        <div class="p-8 border-t border-gray-100 flex flex-col items-center bg-white/95 backdrop-blur-md fixed bottom-0 left-0 right-0 z-40 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.1)]">
            <div id="validation-msg" class="text-red-600 mb-4 hidden font-bold text-lg bg-red-50 p-4 rounded-xl border-2 border-red-200 w-full max-w-md text-center"></div>
            <button id="submit-btn" onclick="validateAndSubmit()" class="bg-green-600 hover:bg-green-700 text-white font-black py-5 px-20 rounded-2xl transition duration-300 shadow-2xl text-2xl uppercase tracking-tighter transform hover:scale-105 active:scale-95">
                Toets Klaar? Lever hier in!
            </button>
        </div>
    </div>

    <!-- Resultaat Scherm -->
    <div id="result-screen" class="hidden p-8 md:p-16">
        <div class="text-center mb-12">
            <div class="text-7xl mb-6">🏆</div>
            <h2 class="text-4xl font-black text-gray-900 mb-2">Goed gedaan, <span id="display-name" class="text-sky-600"></span>!</h2>
            <p class="text-gray-500 font-medium">Je hebt de IEP oefentoets afgerond.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-12">
            <div class="bg-sky-50 p-6 rounded-3xl border-2 border-sky-100 text-center">
                <span class="block text-sky-600 font-black text-4xl mb-1" id="score-spelling">0/15</span>
                <span class="text-xs font-bold uppercase text-sky-800 tracking-widest">Spelling</span>
            </div>
            <div class="bg-purple-50 p-6 rounded-3xl border-2 border-purple-100 text-center">
                <span class="block text-purple-600 font-black text-4xl mb-1" id="score-werkwoorden">0/15</span>
                <span class="text-xs font-bold uppercase text-purple-800 tracking-widest">Werkwoorden</span>
            </div>
            <div class="bg-orange-50 p-6 rounded-3xl border-2 border-orange-100 text-center">
                <span class="block text-orange-600 font-black text-4xl mb-1" id="score-grammatica">0/10</span>
                <span class="text-xs font-bold uppercase text-orange-800 tracking-widest">Grammatica</span>
            </div>
        </div>

        <div class="bg-gray-50 p-8 rounded-3xl border-2 border-gray-100 mb-10 text-center">
            <h4 class="font-black text-gray-400 uppercase tracking-widest mb-4 text-sm">Eindoordeel:</h4>
            <div id="feedback-final" class="text-2xl font-bold text-gray-800"></div>
        </div>

        <div class="text-center">
            <button onclick="location.reload()" class="bg-gray-900 text-white font-bold py-4 px-12 rounded-2xl shadow-xl hover:bg-black transition transform hover:scale-105">Nog een keer oefenen</button>
        </div>
    </div>
</div>

<script>
const rawDatabase = [
    // --- SPELLING (15 vragen) ---
    { cat: "spelling", q: "Liz hangt overal sli___ers op voor het feest.", instr: "Welke letters horen op de lege plek?", type: "MC", options: ["pp", "p"], correct: "pp", hint: "Slippers: korte klank 'i', dus dubbelzetter p." },
    { cat: "spelling", q: "De auto rijdt tegen een paa___tje.", instr: "Welke letters horen op de lege plek?", type: "MC", options: ["l", "ll"], correct: "l", hint: "Paaltje: lange klank 'aa', we schrijven één l." },
    { cat: "spelling", q: "In het bos staan veel bo___en.", instr: "Welke letters horen op de lege plek?", type: "MC", options: ["m", "mm"], correct: "m", hint: "Bomen: lange klank 'oo', we schrijven één m." },
    { cat: "spelling", q: "Wij eten vanavond ki___enpoten.", instr: "Welke letters horen op de lege plek?", type: "MC", options: ["pp", "p"], correct: "pp", hint: "Kippen: korte klank 'i', dus dubbelzetter p." },
    { cat: "spelling", q: "De juf vertelt mooie verha___en.", instr: "Welke letters horen op de lege plek?", type: "MC", options: ["l", "ll"], correct: "l", hint: "Verhalen: lange klank 'aa', we schrijven één l." },
    { cat: "spelling", q: "Zet de ko___en maar op de tafel.", instr: "Welke letters horen op de lege plek?", type: "MC", options: ["mm", "m"], correct: "mm", hint: "Kommen: korte klank 'o', dus dubbelzetter m." },
    { cat: "spelling", q: "We stonden wel vijf minuten stil voor het stopli___t.", instr: "Welke letters horen op de lege plek?", type: "MC", options: ["ch", "g", "gt"], correct: "ch", hint: "Licht: na een korte klank schrijf je meestal ch." },
    { cat: "spelling", q: "Ik heb gisteren heel hard gela___en.", instr: "Welke letters horen op de lege plek?", type: "MC", options: ["ch", "g"], correct: "ch", hint: "Lachen is een weetwoord met ch." },
    { cat: "spelling", q: "De zon komt op in de vroege o___tend.", instr: "Welke letters horen op de lege plek?", type: "MC", options: ["ch", "g"], correct: "ch", hint: "Ochtend is een weetwoord met ch." },
    { cat: "spelling", q: "We gaan morgen op r___s met de trein.", instr: "Welke klank hoort op de lege plek?", type: "MC", options: ["ei", "ij"], correct: "ei", hint: "Reis staat op de ei-plaat." },
    { cat: "spelling", q: "Ik wil graag een lekker ___sje.", instr: "Welke klank hoort op de lege plek?", type: "MC", options: ["ij", "ei"], correct: "ij", hint: "IJs schrijf je met een lange ij." },
    { cat: "spelling", q: "De geit staat buiten in de w___.", instr: "Welke klank hoort op de lege plek?", type: "MC", options: ["ei", "ij"], correct: "ei", hint: "Wei (met gras) staat op de ei-plaat." },
    { cat: "spelling", q: "De p___w heeft prachtige veren.", instr: "Welke klank hoort op de lege plek?", type: "MC", options: ["au", "ou"], correct: "au", hint: "Pauw schrijf je met atje au." },
    { cat: "spelling", q: "De ___ liggen op het strand.", instr: "Schrijf het meervoud op van: schelp", type: "OPEN", correct: "schelpen", hint: "Zelfstandig naamwoord + en." },
    { cat: "spelling", q: "Ik zie twee ___ in de lucht vliegen.", instr: "Schrijf het meervoud op van: duif", type: "OPEN", correct: "duiven", hint: "De f verandert in een v bij het meervoud." },

    // --- WERKWOORDEN (15 vragen) ---
    { cat: "werkwoorden", q: "Ik ___ elke dag naar school.", instr: "Schrijf de tegenwoordige tijd op van: lopen", type: "MC", options: ["loop", "loopt", "lopen"], correct: "loop", hint: "Ik-vorm is alleen de stam." },
    { cat: "werkwoorden", q: "Hij ___ snel naar huis.", instr: "Schrijf de tegenwoordige tijd op van: fietsen", type: "MC", options: ["fietst", "fiets", "fietsen"], correct: "fietst", hint: "Hij-vorm is stam + t." },
    { cat: "werkwoorden", q: "De hond ___ heel hard naar de postbode.", instr: "Schrijf de tegenwoordige tijd op van: blaffen", type: "MC", options: ["blaft", "blaf", "blaff"], correct: "blaft", hint: "Stam + t." },
    { cat: "werkwoorden", q: "Wij ___ samen een vrolijk liedje.", instr: "Schrijf de tegenwoordige tijd op van: zingen", type: "MC", options: ["zingen", "zingt", "zing"], correct: "zingen", hint: "Wij-vorm is het hele werkwoord." },
    { cat: "werkwoorden", q: "De meester ___ een spannend verhaal.", instr: "Schrijf de tegenwoordige tijd op van: vertellen", type: "OPEN", correct: "vertelt", hint: "Onderwerp is de meester (hij), dus stam + t." },
    { cat: "werkwoorden", q: "Mijn oma ___ rustig op de stoel.", instr: "Schrijf de tegenwoordige tijd op van: zitten", type: "OPEN", correct: "zit", hint: "Stam + t, maar we schrijven nooit dubbel t aan het eind." },
    { cat: "werkwoorden", q: "Het ___ vandaag erg hard.", instr: "Schrijf de tegenwoordige tijd op van: regenen", type: "OPEN", correct: "regent", hint: "Stam + t." },
    { cat: "werkwoorden", q: "Wij ___ gisteren de hele middag in het bos.", instr: "Schrijf de verleden tijd op van: spelen", type: "MC", options: ["speelden", "speelde"], correct: "speelden", hint: "Verleden tijd meervoud: stam + den." },
    { cat: "werkwoorden", q: "Ik ___ gisteren heel erg laat.", instr: "Schrijf de verleden tijd op van: slapen", type: "MC", options: ["sliep", "slaapte"], correct: "sliep", hint: "Slapen is een sterk werkwoord (klankverandering)." },
    { cat: "werkwoorden", q: "De kat ___ behendig in de hoge boom.", instr: "Schrijf de verleden tijd op van: klimmen", type: "MC", options: ["klom", "klimde"], correct: "klom", hint: "Klimmen is een sterk werkwoord." },
    { cat: "werkwoorden", q: "Hij ___ de bal over het hek.", instr: "Schrijf de verleden tijd op van: gooien", type: "OPEN", correct: "gooide", hint: "Zwak werkwoord: stam + de." },
    { cat: "werkwoorden", q: "Ik ___ gisteren een lekkere appel.", instr: "Schrijf de verleden tijd op van: eten", type: "OPEN", correct: "at", hint: "Eten is een sterk werkwoord." },
    { cat: "werkwoorden", q: "Ik heb mijn kamer gisteren helemaal ___.", instr: "Schrijf het voltooid deelwoord op van: opruimen", type: "OPEN", correct: "opgeruimd", hint: "Eindigt op een d (ruim-de)." },
    { cat: "werkwoorden", q: "Gisteren ___ de zon de hele dag.", instr: "Schrijf de verleden tijd op van: schijnen", type: "OPEN", correct: "scheen", hint: "Sterk werkwoord." },
    { cat: "werkwoorden", q: "Wij ___ gisteren naar de sportclub.", instr: "Schrijf de verleden tijd op van: fietsen", type: "MC", options: ["fietsten", "fietste"], correct: "fietsten", hint: "Meervoud, fiet-sten (s zit in 't kofschip x)." },

    // --- GRAMMATICA (10 vragen) ---
    { cat: "grammatica", q: "De man laat ___ niet met rust. (de jongens)", instr: "Wat hoort op de lege plek?", type: "MC", options: ["hen", "hem"], correct: "hen", hint: "Het gaat om 'de jongens' (meervoud)." },
    { cat: "grammatica", q: "Samen met zijn vrouw wacht ___ de jongens op. (de man)", instr: "Wat hoort op de lege plek?", type: "MC", options: ["hij", "zij"], correct: "hij", hint: "De man is een hij." },
    { cat: "grammatica", q: "Dat is ___ nieuwe fiets van mijn broer.", instr: "Welk lidwoord hoort hier?", type: "MC", options: ["de", "het"], correct: "de", hint: "De fiets." },
    { cat: "grammatica", q: "Ik woon in het land ___.", instr: "Schrijf de naam van het land met de juiste hoofdletter: nederland", type: "OPEN", correct: "Nederland", hint: "Namen van landen schrijf je met een hoofdletter.", caseSensitive: true },
    { cat: "grammatica", q: "Waar ben je___", instr: "Welk leesteken hoort aan het eind van de zin?", type: "MC", options: ["?", "!", "."], correct: "?", hint: "Dit is een vraag." },
    { cat: "grammatica", q: "Dit is de tas van ___.", instr: "Vul aan: haar of hem? (het gaat om Lisa)", type: "MC", options: ["haar", "hem"], correct: "haar", hint: "Lisa is een meisje." },
    { cat: "grammatica", q: "Ik heb gisteren ___ grote hond gezien.", instr: "Welk woord hoort hier?", type: "MC", options: ["een", "het"], correct: "een", hint: "Een onbepaald lidwoord." },
    { cat: "grammatica", q: "Mijn juf heet mevrouw ___.", instr: "Schrijf de naam met de juiste hoofdletter: jansen", type: "OPEN", correct: "Jansen", hint: "Achternamen schrijf je met een hoofdletter.", caseSensitive: true },
    { cat: "grammatica", q: "De jongens pakken ___ eigen fietsen.", instr: "Vul in: hun of hen?", type: "MC", options: ["hun", "hen"], correct: "hun", hint: "Het is hun bezit (hun fietsen)." },
    { cat: "grammatica", q: "Ik geef het cadeau aan ___.", instr: "Vul in: hun of hen? (het gaat om opa en oma)", type: "MC", options: ["hen", "hun"], correct: "hen", hint: "Na een voorzetsel (aan) gebruik je hen." }
];

let selectedQuestions = [];
let questionState = {}; 
const TOTAL_QUESTIONS = 40;
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbzZhuEwPkor67-Eym2DK3AW2HO_rkQw72c2QR8VwHK9OlGCjay3rPM9a3NA9t1bubeG/exec";

function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function startTest() {
    const name = document.getElementById('student-name').value.trim();
    if (!name) { alert("Vul eerst je naam in!"); return; }

    const s = shuffle(rawDatabase.filter(q => q.cat === 'spelling')).slice(0, 15);
    const w = shuffle(rawDatabase.filter(q => q.cat === 'werkwoorden')).slice(0, 15);
    const g = shuffle(rawDatabase.filter(q => q.cat === 'grammatica')).slice(0, 10);
    
    selectedQuestions = shuffle([...s, ...w, ...g]);
    
    selectedQuestions.forEach((q, idx) => {
        questionState[idx] = { attempts: 0, status: 'open', givenAnswer: "" };
    });

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    renderAllQuestions();
}

function renderAllQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    
    selectedQuestions.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = "question-card bg-white p-8 rounded-3xl shadow-sm max-w-2xl mx-auto status-open";
        card.id = `card-${index}`;

        // Prominent instruction block
        let html = `
            <div class="mb-6">
                <div class="flex items-center gap-2 mb-2">
                    <span class="bg-gray-100 text-gray-500 text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-tighter">Vraag ${index + 1}</span>
                    <div class="h-px bg-gray-100 flex-grow"></div>
                </div>
                <h3 class="text-xl font-black text-gray-900 leading-tight">${q.instr}</h3>
            </div>
            
            <div class="bg-slate-50 p-6 rounded-2xl mb-8 border border-slate-100">
                <p class="text-2xl font-bold text-gray-800 tracking-tight">${q.q}</p>
            </div>
        `;

        if (q.type === "MC") {
            const shuffledOptions = shuffle([...q.options]);
            html += `<div class="grid grid-cols-1 gap-3">`;
            shuffledOptions.forEach((opt) => {
                html += `
                    <button 
                        type="button"
                        onclick="handleSelection(${index}, '${opt}', this)"
                        class="answer-opt text-left p-5 border-2 border-gray-100 rounded-2xl hover:bg-sky-50 hover:border-sky-300 font-black transition-all text-gray-700 bg-white shadow-sm text-lg">
                        ${opt}
                    </button>`;
            });
            html += `</div>`;
        } else {
            html += `
                <div class="flex flex-col md:flex-row gap-3">
                    <input type="text" id="input-${index}" onkeydown="if(event.key==='Enter') handleSelection(${index})" class="flex-grow p-5 border-2 border-gray-100 rounded-2xl font-black text-xl focus:border-sky-500 focus:outline-none shadow-sm placeholder:text-gray-200" placeholder="Typ je antwoord...">
                    <button onclick="handleSelection(${index})" class="bg-sky-600 text-white px-10 py-5 rounded-2xl font-black text-lg shadow-lg hover:bg-sky-700 active:scale-95 transition-transform uppercase">OK</button>
                </div>`;
        }

        html += `<div id="feedback-${index}" class="mt-6 font-black text-base min-h-[24px]"></div>`;
        html += `<div id="hint-${index}" class="hidden mt-4 p-5 bg-orange-50 text-orange-800 rounded-2xl text-sm italic border-l-4 border-orange-400 font-medium"></div>`;

        card.innerHTML = html;
        container.appendChild(card);
    });
}

function handleSelection(index, val = null, btn = null) {
    const state = questionState[index];
    if (state.status !== 'open') return;

    const q = selectedQuestions[index];
    let userVal = val;
    if (q.type === 'OPEN') {
        userVal = document.getElementById(`input-${index}`).value.trim();
        if (!userVal) return;
    }

    const isCorrect = (q.caseSensitive) 
        ? userVal === q.correct 
        : userVal.toLowerCase() === q.correct.toLowerCase();

    const card = document.getElementById(`card-${index}`);
    const feedback = document.getElementById(`feedback-${index}`);
    const hint = document.getElementById(`hint-${index}`);

    if (isCorrect) {
        state.status = 'correct';
        state.givenAnswer = userVal;
        card.className = "question-card p-8 rounded-3xl shadow-md max-w-2xl mx-auto status-correct";
        feedback.innerHTML = `<span class="text-green-600 flex items-center gap-2 pop-in">✨ Goed gedaan!</span>`;
        hint.classList.add('hidden');
        if(btn) btn.classList.add('bg-green-50', 'border-green-400', 'text-green-700');
        lockQuestion(index);
        setTimeout(() => scrollNext(index), 400);
    } else {
        state.attempts++;
        state.givenAnswer = userVal;
        if (state.attempts >= 2) {
            state.status = 'failed';
            card.className = "question-card p-8 rounded-3xl shadow-md max-w-2xl mx-auto status-wrong";
            feedback.innerHTML = `<span class="text-red-600">Jammer! Het juiste antwoord was: <span class="underline">${q.correct}</span></span>`;
            hint.classList.add('hidden');
            if(btn) btn.classList.add('bg-red-50', 'border-red-400', 'text-red-700');
            lockQuestion(index);
            setTimeout(() => scrollNext(index), 1500);
        } else {
            card.className = "question-card p-8 rounded-3xl shadow-md max-w-2xl mx-auto status-retry";
            feedback.innerHTML = `<span class="text-orange-600">Nog een keertje proberen...</span>`;
            hint.innerHTML = `<strong>Hulp:</strong> ${q.hint}`;
            hint.classList.remove('hidden');
            if(btn) {
                btn.disabled = true;
                btn.classList.add('opacity-30', 'bg-gray-100');
            }
        }
    }
    updateProgress();
}

function lockQuestion(index) {
    const card = document.getElementById(`card-${index}`);
    const elements = card.querySelectorAll('button, input');
    elements.forEach(el => {
        if (!el.classList.contains('bg-green-50') && !el.classList.contains('bg-red-50')) {
             el.disabled = true;
             el.classList.add('opacity-50');
        }
    });
}

function scrollNext(idx) {
    const next = document.getElementById(`card-${idx + 1}`);
    if (next) next.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function updateProgress() {
    const done = Object.values(questionState).filter(s => s.status !== 'open').length;
    const p = (done / TOTAL_QUESTIONS) * 100;
    document.getElementById('progress-bar').style.width = p + '%';
    document.getElementById('progress-text').innerText = `${done} / ${TOTAL_QUESTIONS}`;
}

async function validateAndSubmit() {
    const done = Object.values(questionState).filter(s => s.status !== 'open').length;
    if (done < TOTAL_QUESTIONS) {
        const m = document.getElementById('validation-msg');
        m.innerText = `Nog ${TOTAL_QUESTIONS - done} vragen niet beantwoord!`;
        m.classList.remove('hidden');
        window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
        return;
    }

    const btn = document.getElementById('submit-btn');
    btn.innerText = "Bezig met verzenden...";
    btn.disabled = true;

    let foutenStr = "";
    let correctCount = 0;
    selectedQuestions.forEach((q, i) => {
        if(questionState[i].status === 'correct') {
            correctCount++;
        } else {
            foutenStr += `[Vraag ${i+1}] ${q.q} -> Ingevuld: ${questionState[i].givenAnswer} (Correct: ${q.correct}) \n`;
        }
    });

    const payload = {
        naam: document.getElementById('student-name').value,
        datum: new Date().toLocaleString('nl-NL'),
        score: `${correctCount}/${TOTAL_QUESTIONS}`,
        Opmerkingen: foutenStr || "Perfecte score!"
    };

    try {
        await fetch(SHEETS_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload)
        });
    } catch (e) { console.error(e); }

    showEndScreen(correctCount);
}

function showEndScreen(score) {
    window.scrollTo({top: 0, behavior: 'smooth'});
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('display-name').innerText = document.getElementById('student-name').value;
    
    const feedbackBox = document.getElementById('feedback-final');
    if(score === 40) feedbackBox.innerHTML = "FENOMENAAL! Je hebt alles goed! 🥳";
    else if(score > 32) feedbackBox.innerHTML = "Geweldig! Je bent een echte taalkoning(in)! 👑";
    else if(score > 24) feedbackBox.innerHTML = "Goed gedaan! Je bent goed op weg. 👍";
    else feedbackBox.innerHTML = "Mooi geoefend! Volgende keer gaat het nog beter. 💪";

    const cats = { spelling: {c:0, t:15}, werkwoorden: {c:0, t:15}, grammatica: {c:0, t:10} };
    selectedQuestions.forEach((q, i) => {
        if(questionState[i].status === 'correct') cats[q.cat].c++;
    });

    for(let c in cats) {
        document.getElementById(`score-${c}`).innerText = `${cats[c].c}/${cats[c].t}`;
    }
}
</script>

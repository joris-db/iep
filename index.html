<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oefentoets Taalverzorging - L6 t/m L8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; scroll-behavior: smooth; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.3s ease; }
        .option-btn { border: 2px solid #e5e7eb; transition: all 0.2s; cursor: pointer; text-align: left; width: 100%; padding: 0.75rem; border-radius: 0.5rem; background: white; margin-bottom: 0.5rem; }
        .option-btn:hover:not(.disabled) { border-color: #3b82f6; background-color: #eff6ff; }
        
        .sticky-footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 2px solid #e5e7eb; padding: 1rem; z-index: 50; display: flex; justify-content: center; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
        
        @keyframes pulse-red {
            0% { border-color: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { border-color: #ef4444; box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { border-color: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .unanswered-alert { animation: pulse-red 1.5s infinite; border-width: 3px !important; }
        
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8 pb-24">
    <div class="max-w-3xl mx-auto">
        <!-- Startscherm -->
        <div id="setup-container" class="card p-8 text-center">
            <h1 class="text-3xl font-bold text-blue-800 mb-2">IEP Taalverzorging Portaal</h1>
            <p class="text-gray-600 mb-8">Selecteer je toetsniveau en vul je naam in.</p>
            
            <div class="mb-6 max-w-sm mx-auto">
                <label class="block text-left text-sm font-bold text-gray-700 mb-2">Je naam:</label>
                <input type="text" id="student-name" class="p-3 border-2 w-full rounded-lg mb-4" placeholder="Voor- en achternaam">
                
                <label class="block text-left text-sm font-bold text-gray-700 mb-2">Kies toets:</label>
                <select id="grade-select" class="p-3 border-2 w-full rounded-lg bg-white">
                    <option value="6">Leerjaar 6 (0F/1F)</option>
                    <option value="7">Leerjaar 7 (1F)</option>
                    <option value="8_1f2f">Leerjaar 8 (1F-2F)</option>
                    <option value="8_3f">Leerjaar 8 (3F - Verdieping)</option>
                </select>
            </div>

            <button onclick="startQuiz()" class="bg-blue-600 text-white px-10 py-3 rounded-lg hover:bg-blue-700 font-bold transition-all transform hover:scale-105">Start Oefentoets</button>
        </div>

        <!-- Quiz UI -->
        <div id="quiz-ui" class="hidden">
            <header class="mb-6 bg-white p-6 rounded-xl shadow-sm border-b-4 border-blue-600 sticky top-4 z-40">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <p class="text-xs text-gray-400 uppercase font-bold">Leerling</p>
                        <p id="display-name" class="font-bold text-blue-800 text-lg"></p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-gray-400 uppercase font-bold">Niveau</p>
                        <p id="display-grade" class="font-bold text-blue-800 text-lg"></p>
                    </div>
                </div>
                <div class="flex items-center justify-between text-sm font-bold text-gray-500 mb-1">
                    <span>Voortgang</span>
                    <span><span id="progress-text">0</span> / 30</span>
                </div>
                <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
                    <div id="progress-fill" class="h-full bg-blue-500 transition-all duration-300 w-0"></div>
                </div>
            </header>
            
            <div id="quiz-container"></div>
        </div>

        <!-- Resultaten Scherm -->
        <div id="final-result" class="hidden card p-10 text-center">
            <h2 class="text-3xl font-bold mb-4 text-green-700">Toets Afgerond!</h2>
            <div id="submitting-status" class="mb-6 p-4 bg-blue-50 rounded-lg">
                <div class="spinner mr-2"></div> Gegevens worden opgeslagen...
            </div>
            <p class="text-2xl mb-8 font-bold" id="final-score-text"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 font-bold">Terug naar start</button>
        </div>
    </div>

    <!-- Sticky Inleverknop -->
    <div id="sticky-submit" class="sticky-footer hidden">
        <button onclick="validateAndSubmit()" class="bg-green-600 text-white px-12 py-3 rounded-full hover:bg-green-700 font-bold shadow-lg transition-transform active:scale-95">
            Mijn toets inleveren
        </button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZhuEwPkor67-Eym2DK3AW2HO_rkQw72c2QR8VwHK9OlGCjay3rPM9a3NA9t1bubeG/exec";

        // DATABASE GENERATOR HELPER
        function createQuestions(prefix, count) {
            let questions = [];
            for(let i=1; i<=count; i++) {
                questions.push({
                    instr: `${prefix} Oefening`,
                    q: `${prefix} vraag ${i}: Vul het juiste antwoord in voor deze taalvraag.`,
                    options: ["Antwoord A", "Antwoord B", "Antwoord C", "Antwoord D"],
                    correct: "Antwoord A"
                });
            }
            return questions;
        }

        // DATABASE - Leerjaar 6 (0F/1F)
        const db_l6 = [
            { instr: "Spelling", q: "Ik moet even naar de wi...el.", options: ["nk", "ngk", "ng", "k"], correct: "nk" },
            { instr: "Meervoud", q: "Er liggen twee (ei) in de koelkast.", options: ["eieren", "eien", "eis", "eijeren"], correct: "eieren" },
            { instr: "Werkwoordspelling", q: "Mijn zusje (fietsen) elke dag naar school.", options: ["fietst", "fiets", "fietstet", "gefietst"], correct: "fietst" },
            ...createQuestions("L6", 97)
        ];

        // DATABASE - Leerjaar 7 (1F)
        const db_l7 = [
            { instr: "Werkwoordspelling (VT)", q: "De jongen (verhuizen) vorig jaar.", options: ["verhuisde", "verhuiste", "verhuisden", "verhuist"], correct: "verhuisde" },
            { instr: "Aanhalingstekens", q: "Welke zin is correct?", options: ["Hij riep: \"Kom hier!\"", "\"Hij riep:\" Kom hier!", "Hij riep: Kom hier!", "Hij riep \"Kom hier!\""], correct: "Hij riep: \"Kom hier!\"" },
            { instr: "Voltooid deelwoord", q: "Heb jij het raam (blussen)?", options: ["geblust", "geblusd", "bluste", "geblussen"], correct: "geblust" },
            ...createQuestions("L7", 97)
        ];

        // DATABASE - Leerjaar 8 (1F-2F)
        const db_l8_1f2f = [
            { instr: "Dictee", q: "De fietser reed per ... tegen de paal.", options: ["ongeluk", "ongeluck", "onngeluk", "ongelluk"], correct: "ongeluk" },
            { instr: "Meervoud", q: "Onze (sleutel) liggen nog binnen.", options: ["sleutels", "sleutelen", "sleutel's", "sleuteltjes"], correct: "sleutels" },
            { instr: "Interpunctie", q: "Kies de zin met de juiste komma's.", options: ["Ik ga morgen, denk ik, naar de film.", "Ik ga morgen denk ik, naar de film.", "Ik ga, morgen denk ik naar de film.", "Ik ga morgen denk ik naar, de film."], correct: "Ik ga morgen, denk ik, naar de film." },
            ...createQuestions("L8 1F-2F", 97)
        ];

        // DATABASE - Leerjaar 8 (3F)
        const db_l8_3f = [
            { instr: "Werkwoordspelling", q: "De overheid (subsidiëren) de nieuwe plannen.", options: ["subsidieert", "subsidieerd", "subsidieeren", "gesubsidieerd"], correct: "subsidieert" },
            { instr: "Woordenschat", q: "Wat is een synoniem voor 'incidenteel'?", options: ["af en toe", "vaak", "nooit", "altijd"], correct: "af en toe" },
            { instr: "Stijl", q: "Welke zin is het meest zakelijk?", options: ["Ik verzoek u om een reactie.", "Zou je me even kunnen terugbellen?", "Ik wil dat je reageert.", "Reageer effe op mijn mail."], correct: "Ik verzoek u om een reactie." },
            ...createQuestions("L8 3F", 97)
        ];

        let currentQuestions = [];
        let answers = {};
        let studentName = "";
        let selectedLevel = "";

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startQuiz() {
            const nameInput = document.getElementById('student-name');
            studentName = nameInput.value.trim();
            selectedLevel = document.getElementById('grade-select').value;

            if (studentName.length < 3) {
                nameInput.classList.add('border-red-500');
                nameInput.focus();
                return;
            }

            document.getElementById('display-name').innerText = studentName;
            
            const levelNames = {
                "6": "Leerjaar 6 (0F/1F)",
                "7": "Leerjaar 7 (1F)",
                "8_1f2f": "Leerjaar 8 (1F-2F)",
                "8_3f": "Leerjaar 8 (3F)"
            };
            document.getElementById('display-grade').innerText = levelNames[selectedLevel];
            
            document.getElementById('setup-container').classList.add('hidden');
            document.getElementById('quiz-ui').classList.remove('hidden');
            document.getElementById('sticky-submit').classList.remove('hidden');

            let sourceDb;
            if(selectedLevel === "6") sourceDb = db_l6;
            else if(selectedLevel === "7") sourceDb = db_l7;
            else if(selectedLevel === "8_1f2f") sourceDb = db_l8_1f2f;
            else sourceDb = db_l8_3f;

            currentQuestions = shuffle([...sourceDb]).slice(0, 30);
            renderQuestions();
            window.scrollTo(0,0);
        }

        function renderQuestions() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            currentQuestions.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card p-6 mb-6 border-2 border-transparent';
                card.id = `q-card-${index}`;
                
                const opts = shuffle([...item.options]);
                card.innerHTML = `
                    <div class="text-xs font-bold text-gray-400 uppercase mb-2">Vraag ${index + 1} • ${item.instr}</div>
                    <p class="text-lg font-semibold text-gray-800 mb-4">${item.q}</p>
                    <div class="grid gap-2" id="options-${index}">
                        ${opts.map(opt => `
                            <button onclick="selectOption(${index}, \`${opt}\`)" class="option-btn" data-val="${opt}">${opt}</button>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.selectOption = (qIdx, val) => {
            answers[qIdx] = val;
            const container = document.getElementById(`options-${qIdx}`);
            container.querySelectorAll('button').forEach(btn => {
                btn.classList.remove('border-blue-500', 'bg-blue-50', 'font-bold');
                if(btn.dataset.val === val) btn.classList.add('border-blue-500', 'bg-blue-50', 'font-bold');
            });
            document.getElementById(`q-card-${qIdx}`).classList.remove('unanswered-alert');
            updateProgress();
        };

        function updateProgress() {
            const count = Object.keys(answers).length;
            document.getElementById('progress-text').innerText = count;
            document.getElementById('progress-fill').style.width = (count / 30 * 100) + '%';
        }

        function validateAndSubmit() {
            const unanswered = [];
            for(let i=0; i<30; i++) {
                if(!answers[i]) unanswered.push(i);
            }

            if(unanswered.length > 0) {
                unanswered.forEach(idx => {
                    document.getElementById(`q-card-${idx}`).classList.add('unanswered-alert');
                });
                
                // Scroll naar de eerste onbeantwoorde vraag
                document.getElementById(`q-card-${unanswered[0]}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                const toast = document.createElement('div');
                toast.className = "fixed top-24 left-1/2 -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-full shadow-2xl z-[100] font-bold";
                toast.innerText = `Je moet nog ${unanswered.length} vragen beantwoorden!`;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
                return;
            }
            processResults();
        }

        async function processResults() {
            window.scrollTo(0,0);
            document.getElementById('quiz-ui').classList.add('hidden');
            document.getElementById('sticky-submit').classList.add('hidden');
            document.getElementById('final-result').classList.remove('hidden');

            let score = 0;
            currentQuestions.forEach((q, idx) => {
                if(answers[idx] === q.correct) score++;
            });

            document.getElementById('final-score-text').innerText = `Score: ${score} van de 30 goed!`;

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        naam: studentName,
                        niveau: selectedLevel,
                        score: score,
                        datum: new Date().toLocaleString('nl-NL')
                    })
                });
                document.getElementById('submitting-status').innerHTML = "✅ Resultaten veilig opgeslagen.";
            } catch (e) {
                document.getElementById('submitting-status').innerHTML = "⚠️ Kon niet opslaan, meld dit bij de juf/meester.";
            }
        }
    </script>
</body>
</html>

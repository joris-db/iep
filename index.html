<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oefentoets Taalverzorging - 40 Vragen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.3s ease; }
        .option-btn { border: 2px solid #e5e7eb; transition: all 0.2s; cursor: pointer; text-align: left; width: 100%; padding: 0.75rem; border-radius: 0.5rem; background: white; }
        .option-btn:hover:not(.disabled) { border-color: #3b82f6; background-color: #eff6ff; }
        
        .correct { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46; font-weight: bold; }
        .incorrect { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        
        .hint-text { color: #1e40af; background-color: #eff6ff; border-left: 4px solid #3b82f6; margin-top: 10px; padding: 10px; border-radius: 4px; }
        .disabled { cursor: default; opacity: 0.8; pointer-events: none; }
        
        input[type="text"] { border: 2px solid #e5e7eb; outline: none; transition: all 0.2s; padding: 10px; border-radius: 8px; width: 100%; }
        input[type="text"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .instruction { color: #4b5563; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.025em; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: #3b82f6; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <div id="login-container" class="card p-8 text-center">
            <h1 class="text-3xl font-bold text-blue-800 mb-4">Oefentoets Taalverzorging</h1>
            <p class="text-gray-600 mb-6">Voer je volledige naam in om te beginnen.</p>
            <input type="text" id="student-name" class="p-3 border-2 w-full max-w-sm mb-4" placeholder="Voor- en achternaam" onkeypress="if(event.key === 'Enter') startQuiz()">
            <br>
            <button onclick="startQuiz()" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 font-bold transition-all transform hover:scale-105">Begin de Toets</button>
        </div>

        <div id="quiz-ui" class="hidden">
            <header class="mb-4 text-center bg-white p-6 rounded-xl shadow-sm border-b-4 border-blue-600">
                <h1 class="text-2xl font-bold text-blue-800">Cito-stijl Oefentoets</h1>
                <p class="text-gray-600">Leerling: <span id="display-name" class="font-bold text-blue-600"></span></p>
                <div class="mt-4 flex items-center justify-between text-sm font-bold text-gray-500">
                    <span>Voortgang</span>
                    <span><span id="progress-text">0</span> / 30</span>
                </div>
                <div class="progress-bar mt-2">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </header>
            
            <div id="quiz-container"></div>

            <div id="submit-area" class="hidden mt-8 p-8 bg-blue-50 rounded-xl border-2 border-blue-200 text-center shadow-inner">
                <h3 class="text-2xl font-bold text-blue-900 mb-2">Goed gedaan!</h3>
                <p class="text-blue-800 mb-6">Je hebt alle vragen doorlopen. Klik op de knop om je resultaten definitief in te leveren.</p>
                <button id="final-submit-btn" class="bg-green-600 text-white px-10 py-4 rounded-xl hover:bg-green-700 font-bold text-xl shadow-lg transition-transform transform hover:scale-105">
                    Resultaten Definitief Inleveren
                </button>
            </div>
        </div>

        <div id="final-result" class="hidden card p-10 text-center">
            <h2 class="text-3xl font-bold mb-4 text-green-700">Ingeleverd!</h2>
            <div id="submitting-status" class="mb-6 p-4 bg-blue-50 rounded-lg border border-blue-100">
                <div class="spinner"></div> Bezig met veilig verzenden naar de spreadsheet...
            </div>
            <p class="text-xl mb-6" id="final-score-text"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">Opnieuw proberen</button>
        </div>
    </div>

    <script>
        // De nieuwe URL die je zojuist hebt gegenereerd
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZhuEwPkor67-Eym2DK3AW2HO_rkQw72c2QR8VwHK9OlGCjay3rPM9a3NA9t1bubeG/exec"; 

        const quizDataRaw = [
            { type: "mc", instr: "Meervoud", q: "In de dierentuin zagen we drie prachtige (giraffe).", options: ["giraffes", "giraffen", "girafes", "giraf's"], correct: "giraffes", hint: "Kijk goed naar de laatste letter van het woord." },
            { type: "mc", instr: "Werkwoordspelling", q: "De ober (schenken) de glazen vol met sap.", options: ["schenkt", "schenk", "schonkt", "geschenkt"], correct: "schenkt", hint: "Het onderwerp is 'de ober' (hij-vorm)." },
            { type: "mc", instr: "Aanhalingstekens", q: "In welke zin staan de aanhalingstekens op de goede plek?", options: ["De leraar riep: \"Pak allemaal je boeken!\"", "\"De leraar riep:\" Pak allemaal je boeken!", "De leraar riep: Pak allemaal je \"boeken!\"", "De leraar \"riep\": Pak allemaal je boeken!"], correct: "De leraar riep: \"Pak allemaal je boeken!\"", hint: "Directe rede komt na de dubbele punt." },
            { type: "mc", instr: "Meervoud", q: "Er liggen veel (taxi) te wachten bij het station.", options: ["taxi's", "taxis", "taxien", "taxies"], correct: "taxi's", hint: "Denk aan de regel voor woorden die op een klinker eindigen." },
            { type: "mc", instr: "Bijvoeglijk naamwoord", q: "De koning zat op een (goud) troon.", options: ["gouden", "goude", "goud", "goudene"], correct: "gouden", hint: "Stoffelijk bijvoeglijk naamwoord." },
            { type: "mc", instr: "Werkwoordspelling (VT)", q: "Vorige week (verhuizen) mijn beste vriend naar een andere stad.", options: ["verhuisde", "verhuiste", "verhuisden", "verhuist"], correct: "verhuisde", hint: "De stam eindigt op een z." },
            { type: "mc", instr: "Verkleinwoord", q: "Kijk daar, een klein (konijn) in het gras!", options: ["konijntje", "konijntien", "konijnpje", "konijnje"], correct: "konijntje", hint: "Woorden op -n krijgen vaak -tje." },
            { type: "mc", instr: "Werkwoordspelling (TT)", q: "(Antwoorden) jij de brief van je oma vandaag nog?", options: ["Antwoord", "Antwoordt", "Antwoordde", "Geantwoord"], correct: "Antwoord", hint: "Jij achter de persoonsvorm = geen -t." },
            { type: "mc", instr: "Meervoud", q: "In de herfst vallen de (blad) van de bomen.", options: ["bladeren", "bladen", "bladers", "blads"], correct: "bladeren", hint: "Onregelmatig meervoud." },
            { type: "mc", instr: "Hoofdletters", q: "In welke zin zijn de hoofdletters goed gebruikt?", options: ["Op dinsdag vliegen we van Schiphol naar Londen.", "Op Dinsdag vliegen we van schiphol naar londen.", "Op dinsdag vliegen we van schiphol naar Londen.", "Op Dinsdag vliegen we van Schiphol naar Londen."], correct: "Op dinsdag vliegen we van Schiphol naar Londen.", hint: "Plaatsnamen wel, dagen niet." },
            { type: "mc", instr: "Voltooid deelwoord", q: "De politie heeft de dief gisteren (pakken).", options: ["gepakt", "gepakkerd", "gepakted", "pakte"], correct: "gepakt", hint: "Gebruik 't kofschip x." },
            { type: "mc", instr: "Meervoud", q: "Onze buren hebben twee grote (hond).", options: ["honden", "hondt", "hondes", "honds"], correct: "honden", hint: "Standaard meervoud op -en." },
            { type: "mc", instr: "Bijvoeglijk naamwoord", q: "Zij draagt een (wol) sjaal tegen de kou.", options: ["wollen", "wolle", "wol", "wollige"], correct: "wollen", hint: "De sjaal is gemaakt van wol." },
            { type: "mc", instr: "Verkleinwoord", q: "Ik drink graag uit dit kleine (glas).", options: ["glaasje", "glastje", "glasje", "glassie"], correct: "glaasje", hint: "Klinker wordt lang." },
            { type: "mc", instr: "Werkwoordspelling (VT)", q: "De kinderen (spelen) de hele middag buiten in de zon.", options: ["speelden", "speelten", "speelde", "gespeeld"], correct: "speelden", hint: "Onderwerp is meervoud." },
            { type: "mc", instr: "Meervoud", q: "In de stad staan veel moderne (gebouw).", options: ["gebouwen", "gebouws", "gebouwtjes", "gebouwden"], correct: "gebouwen", hint: "Meervoud op -en." },
            { type: "mc", instr: "Spelling", q: "In welke zin is het dikgedrukte woord goed gespeld?", options: ["Ik vind het **'s ochtends** lastig.", "Ik vind het **sochtends** lastig.", "Ik vind het **s'ochtends** lastig.", "Ik vind het **s ochtends** lastig."], correct: "Ik vind het **'s ochtends** lastig.", hint: "Apostrof voor de s." },
            { type: "mc", instr: "Werkwoordspelling (VT)", q: "De leraar (leggen) de moeilijke som nog een keer uit.", options: ["legde", "legte", "leidde", "gelegd"], correct: "legde", hint: "G zit niet in 't kofschip." },
            { type: "mc", instr: "Meervoud", q: "De kok snijdt drie (paprika) voor de soep.", options: ["paprika's", "paprikas", "paprikaen", "paprikaes"], correct: "paprika's", hint: "Klinkerregel bij -a." },
            { type: "mc", instr: "Werkwoordspelling (TT)", q: "(Vinden) jij de weg naar het nieuwe station?", options: ["Vind", "Vindt", "Vond", "Gevonden"], correct: "Vind", hint: "Jij achter het werkwoord." },
            { type: "mc", instr: "Hoofdletters", q: "Welk woord moet met een hoofdletter: 'volgende week gaan we naar de efteling in kaatsheuvel.'", options: ["Efteling en Kaatsheuvel", "Volgende en Week", "Alleen Efteling", "Geen enkel woord"], correct: "Efteling en Kaatsheuvel", hint: "Namen van plaatsen en parken." },
            { type: "mc", instr: "Meervoud", q: "In de vijver zwemmen veel (vis).", options: ["vissen", "visen", "viss", "visjes"], correct: "vissen", hint: "Verdubbel de medeklinker." },
            { type: "mc", instr: "Werkwoordspelling (VT)", q: "Wij (fietsen) gisteren helemaal naar het strand.", options: ["fietsten", "fietsden", "fietste", "gefietst"], correct: "fietsten", hint: "S zit in 't kofschip." },
            { type: "mc", instr: "Verkleinwoord", q: "Wat een schattig (lam) loopt daar in de wei!", options: ["lammetje", "lamtje", "lampje", "lametje"], correct: "lammetje", hint: "Medeklinker verdubbelen." },
            { type: "mc", instr: "Bijvoeglijk naamwoord", q: "De ridder droeg een (ijzer) harnas.", options: ["ijzeren", "ijzere", "ijzer", "ijzerig"], correct: "ijzeren", hint: "Materiaal is ijzer." },
            { type: "mc", instr: "Aanhalingstekens", q: "In welke zin staan de aanhalingstekens op de goede plek?", options: ["Mama vroeg: \"Wie wil er een ijsje?\"", "\"Mama vroeg: Wie wil er een ijsje?\"", "Mama vroeg: Wie wil er een \"ijsje?\"", "Mama \"vroeg\": Wie wil er een ijsje?"], correct: "Mama vroeg: \"Wie wil er een ijsje?\"", hint: "Letterlijke tekst tussen tekens." },
            { type: "mc", instr: "Meervoud", q: "De vlieger heeft twee grote (vleugel).", options: ["vleugels", "vleugelen", "vleugel's", "vleugeles"], correct: "vleugels", hint: "Kies tussen -s of -en." },
            { type: "mc", instr: "Werkwoordspelling (TT)", q: "Het meisje (beloven) plechtig dat ze op tijd zal zijn.", options: ["belooft", "beloofd", "belovt", "beloven"], correct: "belooft", hint: "Stam is beloof + t." },
            { type: "mc", instr: "Verkleinwoord", q: "Er drijft een klein (boot) in de sloot.", options: ["bootje", "boottje", "bootje-tje", "bootpje"], correct: "bootje", hint: "Woord op -t krijgt -je." },
            { type: "mc", instr: "Grammatica", q: "Welke zin is grammaticaal juist?", options: ["Ik heb mijn tas op de tafel gelegd.", "Ik heb mijn tas op de tafel geleid.", "Ik heb mijn tas op de tafel gelecht.", "Ik heb mijn tas op de tafel legt"], correct: "Ik heb mijn tas op de tafel gelegd.", hint: "Voltooid deelwoord van leggen." }
        ];

        let currentScore = 0;
        let answeredCount = 0;
        let studentName = "";
        let errorDetails = [];
        let attempts = {};

        function startQuiz() {
            const nameInput = document.getElementById('student-name');
            studentName = nameInput.value.trim();
            if (studentName.length < 3) {
                nameInput.classList.add('border-red-500');
                return;
            }
            document.getElementById('display-name').innerText = studentName;
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('quiz-ui').classList.remove('hidden');
            initQuiz();
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            quizDataRaw.forEach((item, index) => {
                attempts[index] = 0;
                const card = document.createElement('div');
                card.className = 'card p-6 mb-6 border-l-4 border-gray-200';
                card.id = `card-${index}`;
                
                card.innerHTML = `
                    <div class="instruction">${item.instr} (Vraag ${index + 1})</div>
                    <p class="font-bold text-lg mb-4">${item.q}</p>
                    <div class="grid grid-cols-1 gap-3" id="q${index}-inputs">
                        ${item.options.map((opt, i) => `<button onclick="checkMC(${index}, ${i})" id="q${index}-btn${i}" class="option-btn">${opt}</button>`).join('')}
                    </div>
                    <div id="q${index}-hint" class="hint-text hidden"><strong>Tip:</strong> ${item.hint}</div>
                `;
                container.appendChild(card);
            });
        }

        window.checkMC = (qIdx, oIdx) => {
            const container = document.getElementById(`q${qIdx}-inputs`);
            if (container.classList.contains('finalized')) return;

            const item = quizDataRaw[qIdx];
            const isCorrect = item.options[oIdx] === item.correct;
            const card = document.getElementById(`card-${qIdx}`);
            const hint = document.getElementById(`q${qIdx}-hint`);
            
            attempts[qIdx]++;

            if (!isCorrect) {
                if (attempts[qIdx] === 1) {
                    card.classList.replace('border-gray-200', 'border-red-400');
                    document.getElementById(`q${qIdx}-btn${oIdx}`).classList.add('incorrect');
                    hint.classList.remove('hidden');
                    return;
                }
                errorDetails.push(`Vraag ${qIdx + 1}: Fout beantwoord ("${item.options[oIdx]}")`);
            } else {
                if (attempts[qIdx] === 1) currentScore++;
                card.classList.replace('border-gray-200', 'border-green-400');
                card.classList.replace('border-red-400', 'border-green-400');
            }

            container.classList.add('finalized');
            hint.classList.add('hidden');

            const buttons = container.querySelectorAll('button');
            buttons.forEach(btn => btn.classList.add('disabled'));
            const correctIdx = item.options.indexOf(item.correct);
            document.getElementById(`q${qIdx}-btn${correctIdx}`).className = 'option-btn correct disabled';
            if (!isCorrect) document.getElementById(`q${qIdx}-btn${oIdx}`).classList.add('incorrect');

            answeredCount++;
            updateProgress();
        };

        function updateProgress() {
            const percent = (answeredCount / quizDataRaw.length) * 100;
            document.getElementById('progress-fill').style.width = percent + '%';
            document.getElementById('progress-text').innerText = answeredCount;

            if (answeredCount === quizDataRaw.length) {
                document.getElementById('submit-area').classList.remove('hidden');
                document.getElementById('submit-area').scrollIntoView({ behavior: 'smooth' });
                document.getElementById('final-submit-btn').onclick = finishQuiz;
            }
        }

        async function finishQuiz() {
            window.scrollTo(0,0);
            document.getElementById('quiz-ui').classList.add('hidden');
            document.getElementById('final-result').classList.remove('hidden');
            document.getElementById('final-score-text').innerText = `Je score: ${currentScore} / ${quizDataRaw.length}`;
            
            const payload = {
                naam: studentName,
                score: currentScore,
                fouten: errorDetails.length > 0 ? errorDetails.join(", ") : "Geen fouten",
                datum: new Date().toLocaleString('nl-NL')
            };

            try {
                // Verzenden als JSON zoals verwacht door Code.gs
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                document.getElementById('submitting-status').innerHTML = "✅ Resultaten succesvol opgeslagen in de Sheet!";
            } catch (e) {
                console.log(e);
                document.getElementById('submitting-status').innerHTML = "⚠️ Resultaten konden niet automatisch worden verzonden. Maak een foto van je score.";
            }
        }
    </script>
</body>
</html>

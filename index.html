<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oefentoets Taalverzorging - 100 Vragen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.3s ease; }
        .option-btn { border: 2px solid #e5e7eb; transition: all 0.2s; cursor: pointer; text-align: left; width: 100%; padding: 0.75rem; border-radius: 0.5rem; background: white; }
        .option-btn:hover:not(.disabled) { border-color: #3b82f6; background-color: #eff6ff; }
        
        .correct { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46; font-weight: bold; }
        .incorrect { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        
        .hint-text { color: #1e40af; background-color: #eff6ff; border-left: 4px solid #3b82f6; margin-top: 10px; padding: 10px; border-radius: 4px; }
        .disabled { cursor: default; opacity: 0.8; pointer-events: none; }
        
        input[type="text"] { border: 2px solid #e5e7eb; outline: none; transition: all 0.2s; padding: 10px; border-radius: 8px; width: 100%; }
        input[type="text"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .instruction { color: #4b5563; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.025em; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: #3b82f6; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <div id="login-container" class="card p-8 text-center">
            <h1 class="text-3xl font-bold text-blue-800 mb-4">Oefentoets Taalverzorging</h1>
            <p class="text-gray-600 mb-6">Voer je volledige naam in om te beginnen.</p>
            <input type="text" id="student-name" class="p-3 border-2 w-full max-w-sm mb-4" placeholder="Voor- en achternaam" onkeypress="if(event.key === 'Enter') startQuiz()">
            <br>
            <button onclick="startQuiz()" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 font-bold transition-all transform hover:scale-105">Begin de Toets</button>
        </div>

        <div id="quiz-ui" class="hidden">
            <header class="mb-4 text-center bg-white p-6 rounded-xl shadow-sm border-b-4 border-blue-600">
                <h1 class="text-2xl font-bold text-blue-800">Cito-stijl Oefentoets</h1>
                <p class="text-gray-600">Leerling: <span id="display-name" class="font-bold text-blue-600"></span></p>
                <div class="mt-4 flex items-center justify-between text-sm font-bold text-gray-500">
                    <span>Voortgang</span>
                    <span><span id="progress-text">0</span> / 30</span>
                </div>
                <div class="progress-bar mt-2">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </header>
            
            <div id="quiz-container"></div>

            <div id="submit-area" class="hidden mt-8 p-8 bg-blue-50 rounded-xl border-2 border-blue-200 text-center shadow-inner">
                <h3 class="text-2xl font-bold text-blue-900 mb-2">Goed gedaan!</h3>
                <p class="text-blue-800 mb-6">Je hebt de 30 vragen doorlopen. Klik op de knop om je resultaten definitief in te leveren.</p>
                <button id="final-submit-btn" class="bg-green-600 text-white px-10 py-4 rounded-xl hover:bg-green-700 font-bold text-xl shadow-lg transition-transform transform hover:scale-105">
                    Resultaten Definitief Inleveren
                </button>
            </div>
        </div>

        <div id="final-result" class="hidden card p-10 text-center">
            <h2 class="text-3xl font-bold mb-4 text-green-700">Ingeleverd!</h2>
            <div id="submitting-status" class="mb-6 p-4 bg-blue-50 rounded-lg border border-blue-100">
                <div class="spinner"></div> Bezig met veilig verzenden naar de spreadsheet...
            </div>
            <p class="text-xl mb-6" id="final-score-text"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">Nog een keer (nieuwe vragen)</button>
        </div>
    </div>

            { type: "mc", instr: "Verkleinwoord", q: "Op de muur zit een klein (vlieg).", options: ["vliegje", "vliegtje", "vliegetje", "vliegie"], correct: "vliegje", hint: "Standaard -je." },
            { type: "mc", instr: "Bijvoeglijk naamwoord", q: "Ik heb een (zilver) ketting gekregen.", options: ["zilveren", "zilvere", "zilver", "zilverene"], correct: "zilveren", hint: "Stoffelijk." },
            { type: "mc", instr: "Verkleinwoord", q: "Dat kleine (huis) is erg oud.", options: ["huisje", "huistje", "huisetje", "huissie"], correct: "huisje", hint: "Standaard -je." },
            { type: "mc", instr: "Verkleinwoord", q: "Er staat een klein (boom) in de tuin.", options: ["boompje", "boomtje", "boomje", "boometje"], correct: "boompje", hint: "Op -m volgt -pje." },
            { type: "mc", instr: "Verkleinwoord", q: "Ik heb een klein (ring) aan mijn vinger.", options: ["ringetje", "ringtje", "ringpje", "ringje"], correct: "ringetje", hint: "Op -ng volgt -etje." },
            { type: "mc", instr: "Verkleinwoord", q: "Kijk, een klein (ster) aan de hemel.", options: ["sterretje", "stertje", "sterpje", "sterje"], correct: "sterretje", hint: "Dubbele medeklinker." },
            { type: "mc", instr: "Bijvoeglijk naamwoord", q: "De (plastic) bekers zijn op.", options: ["plastic", "plasticen", "plastieken", "plasticce"], correct: "plastic", hint: "Uitzondering bij stoffelijk." },
            { type: "mc", instr: "Verkleinwoord", q: "Ik kreeg een klein (kus) van oma.", options: ["kusje", "kustje", "kusetje", "kussentje"], correct: "kusje", hint: "Standaard -je." },
            { type: "mc", instr: "Bijvoeglijk naamwoord", q: "Hij draagt een (leer) jas.", options: ["leren", "leer", "lere", "leerene"], correct: "leren", hint: "Stoffelijk." },
            { type: "mc", instr: "Verkleinwoord", q: "Mijn zusje heeft een klein (mond).", options: ["mondje", "mondtje", "mondetje", "montje"], correct: "mondje", hint: "Op -d volgt -je." },
            { type: "mc", instr: "Verkleinwoord", q: "Wat een klein (ei) is dit.", options: ["eitje", "eiertje", "eietje", "eijetje"], correct: "eitje", hint: "Onregelmatig." },
            { type: "mc", instr: "Verkleinwoord", q: "Heb je dat kleine (spel) al gezien?", options: ["spelletje", "speltje", "spelpje", "speletje"], correct: "spelletje", hint: "Dubbele medeklinker." },

            // Categorie: Overige Spelling (15 vragen)
            { type: "mc", instr: "Spelling", q: "In welke zin is het dikgedrukte woord goed gespeld?", options: ["Ik vind het <b>'s ochtends</b> lastig.", "Ik vind het <b>sochtends</b> lastig.", "Ik vind het <b>s'ochtends</b> lastig.", "Ik vind het <b>s ochtends</b> lastig."], correct: "Ik vind het <b>'s ochtends</b> lastig.", hint: "Apostrof voor de s." },
            { type: "mc", instr: "Grammatica", q: "Welke zin is grammaticaal juist?", options: ["Ik heb mijn tas op de tafel gelegd.", "Ik heb mijn tas op de tafel geleid.", "Ik heb mijn tas op de tafel gelecht.", "Ik heb mijn tas op de tafel legt"], correct: "Ik heb mijn tas op de tafel gelegd.", hint: "Leggen - gelegd." },
            { type: "mc", instr: "Spelling", q: "Wat is de juiste spelling voor het cijfer 88?", options: ["achtentachtig", "acht en tachtig", "acht-en-tachtig", "achttentachtig"], correct: "achtentachtig", hint: "Alles aan elkaar." },
            { type: "mc", instr: "Spelling", q: "Welk woord is goed gespeld?", options: ["onmiddellijk", "onmidellijk", "onmiddelijk", "onmidelijk"], correct: "onmiddellijk", hint: "Dubbel m, dubbel l." },
            { type: "mc", instr: "Spelling", q: "Wat is juist?", options: ["café", "cafe", "caffé", "cafë"], correct: "café", hint: "Accent aigu." },
            { type: "mc", instr: "Spelling", q: "Hoe schrijf je dit woord?", options: ["cadeau", "kado", "kadoe", "cadeau's"], correct: "cadeau", hint: "Frans leenwoord." },
            { type: "mc", instr: "Spelling", q: "Welk woord is correct?", options: ["applaus", "aplaus", "applauss", "applausse"], correct: "applaus", hint: "Dubbel p." },
            { type: "mc", instr: "Spelling", q: "Kies de juiste spelling:", options: ["enigszins", "enigsins", "enigzins", "enichszins"], correct: "enigszins", hint: "Met sz." },
            { type: "mc", instr: "Spelling", q: "Wat is goed gespeld?", options: ["pannenkoek", "pannekoek", "pannenkoeken", "pankoke"], correct: "pannenkoek", hint: "Tussen-n regel." },
            { type: "mc", instr: "Spelling", q: "Hoe schrijf je het meervoud van 'perzik'?", options: ["perziken", "perzikken", "perziks", "perziken"], correct: "perziken", hint: "Geen dubbel k (klemtoon)." },
            { type: "mc", instr: "Spelling", q: "Wat is de juiste spelling?", options: ["beide", "beiden", "bijde", "bijden"], correct: "beide", hint: "Zonder n bij zaken." },
            { type: "mc", instr: "Spelling", q: "Wat is juist?", options: ["ten alle tijden", "te allen tijde", "ten alle tijde", "te alle tijden"], correct: "te allen tijde", hint: "Oude naamval." },
            { type: "mc", instr: "Spelling", q: "Hoe schrijf je dit woord?", options: ["bureau", "buro", "bureu", "burea"], correct: "bureau", hint: "Frans leenwoord." },
            { type: "mc", instr: "Spelling", q: "Welk woord is juist?", options: ["elektriciteit", "electriciteit", "elektriciteit", "electrisiteit"], correct: "elektriciteit", hint: "Met k en c." },
            { type: "mc", instr: "Spelling", q: "Kies de goede vorm:", options: ["verrassing", "verasing", "verassing", "verrasching"], correct: "verrassing", hint: "Dubbel r, dubbel s." }
        ];

        let currentQuestions = [];
        let currentScore = 0;
        let answeredCount = 0;
        let studentName = "";
        let errorDetails = [];
        let attempts = {};

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz() {
            const nameInput = document.getElementById('student-name');
            studentName = nameInput.value.trim();
            if (studentName.length < 3) {
                nameInput.classList.add('border-red-500');
                return;
            }
            document.getElementById('display-name').innerText = studentName;
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('quiz-ui').classList.remove('hidden');
            
            // 30 willekeurige vragen kiezen
            const shuffledDb = shuffleArray([...database]);
            currentQuestions = shuffledDb.slice(0, 30);
            
            initQuiz();
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            
            currentQuestions.forEach((item, index) => {
                attempts[index] = 0;
                const card = document.createElement('div');
                card.className = 'card p-6 mb-6 border-l-4 border-gray-200';
                card.id = `card-${index}`;
                
                // Antwoorden husselen
                const shuffledOptions = shuffleArray([...item.options]);
                
                card.innerHTML = `
                    <div class="instruction">${item.instr} (Vraag ${index + 1})</div>
                    <p class="font-bold text-lg mb-4">${item.q}</p>
                    <div class="grid grid-cols-1 gap-3" id="q${index}-inputs">
                        ${shuffledOptions.map((opt, i) => `
                            <button onclick="checkMC(${index}, '${opt.replace(/'/g, "\\'")}')" class="option-btn">${opt}</button>
                        `).join('')}
                    </div>
                    <div id="q${index}-hint" class="hint-text hidden"><strong>Tip:</strong> ${item.hint}</div>
                `;
                container.appendChild(card);
            });
        }

        window.checkMC = (qIdx, chosenAnswer) => {
            const container = document.getElementById(`q${qIdx}-inputs`);
            if (container.classList.contains('finalized')) return;

            const item = currentQuestions[qIdx];
            const isCorrect = chosenAnswer === item.correct;
            const card = document.getElementById(`card-${qIdx}`);
            const hint = document.getElementById(`q${qIdx}-hint`);
            
            attempts[qIdx]++;

            const buttons = container.querySelectorAll('button');
            let clickedBtn;
            buttons.forEach(btn => {
                if(btn.innerText === chosenAnswer) clickedBtn = btn;
            });

            if (!isCorrect) {
                if (attempts[qIdx] === 1) {
                    // Registreer fout op de achtergrond
                    errorDetails.push(`Vraag ${qIdx + 1} (${item.instr}): Gekozen "${chosenAnswer}" (Correct was "${item.correct}")`);
                    card.classList.replace('border-gray-200', 'border-red-400');
                    clickedBtn.classList.add('incorrect');
                    hint.classList.remove('hidden');
                    return; 
                }
            } else {
                if (attempts[qIdx] === 1) {
                    currentScore++;
                }
                card.classList.replace('border-gray-200', 'border-green-400');
                card.classList.replace('border-red-400', 'border-green-400');
            }

            // Vraag definitief afsluiten
            container.classList.add('finalized');
            hint.classList.add('hidden');

            buttons.forEach(btn => {
                btn.classList.add('disabled');
                if (btn.innerText === item.correct) {
                    btn.className = 'option-btn correct disabled';
                } else if (btn.innerText === chosenAnswer && !isCorrect) {
                    btn.classList.add('incorrect');
                }
            });

            answeredCount++;
            updateProgress();
        };

        function updateProgress() {
            const total = currentQuestions.length;
            const percent = (answeredCount / total) * 100;
            document.getElementById('progress-fill').style.width = percent + '%';
            document.getElementById('progress-text').innerText = answeredCount;

            if (answeredCount === total) {
                document.getElementById('submit-area').classList.remove('hidden');
                document.getElementById('submit-area').scrollIntoView({ behavior: 'smooth' });
                document.getElementById('final-submit-btn').onclick = finishQuiz;
            }
        }

        async function finishQuiz() {
            window.scrollTo(0,0);
            document.getElementById('quiz-ui').classList.add('hidden');
            document.getElementById('final-result').classList.remove('hidden');
            document.getElementById('final-score-text').innerText = `Je score: ${currentScore} / ${currentQuestions.length}`;
            
            const payload = {
                naam: studentName,
                score: currentScore,
                fouten: errorDetails.length > 0 ? errorDetails.join(" | ") : "Geen fouten",
                datum: new Date().toLocaleString('nl-NL')
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                document.getElementById('submitting-status').innerHTML = "✅ Resultaten succesvol opgeslagen!";
            } catch (e) {
                document.getElementById('submitting-status').innerHTML = "⚠️ Verzenden naar Sheet mislukt. Maak een foto van je score.";
            }
        }
    </script>

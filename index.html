<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IEP Toets Taalverzorging Groep 7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { scroll-behavior: smooth; }
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .question-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hidden { display: none; }
        .correct-answer-fill { background-color: #dcfce7; border-color: #22c55e; }
        .wrong-answer-fill { background-color: #fee2e2; border-color: #ef4444; color: #b91c1c; }
        .hint-box { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Focus stijl */
        input:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); }
        
        /* Progress bar sticky bovenin */
        .sticky-progress { position: sticky; top: 0; z-index: 50; }
    </style>
</head>
<body class="p-4 md:p-8">

<div id="app" class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden">
    <!-- Header -->
    <header class="bg-blue-600 p-6 text-white text-center">
        <h1 class="text-2xl font-bold">IEP Toets: Taalverzorging 1F-2F</h1>
        <p class="text-blue-100">Groep 7 - Toetsomgeving</p>
    </header>

    <!-- Start Scherm -->
    <div id="start-screen" class="p-8 text-center">
        <div class="mb-6">
            <label class="block text-gray-700 font-semibold mb-2 text-lg">Vul je naam in om te beginnen:</label>
            <input type="text" id="student-name" class="w-full md:w-80 p-4 border-2 border-gray-200 rounded-xl focus:outline-none text-center text-xl font-bold" placeholder="Voornaam Achternaam">
        </div>
        <button onclick="startTest()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-full transition duration-300 transform hover:scale-105 shadow-lg text-lg">
            Start de Toets (40 vragen)
        </button>
        <p class="mt-6 text-sm text-gray-500 italic">De vragen worden automatisch gecentreerd tijdens het maken.</p>
    </div>

    <!-- Quiz Scherm -->
    <div id="quiz-screen" class="hidden">
        <div class="bg-gray-100 p-2 sticky-progress shadow-sm border-b border-gray-200">
            <div class="flex justify-between items-center mb-1 px-4">
                <span class="text-xs font-bold text-gray-600 uppercase">Voortgang</span>
                <span id="progress-text" class="text-xs font-bold text-blue-600">0 / 40</span>
            </div>
            <div class="bg-gray-300 h-3 w-full rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-green-500 h-3 w-0 transition-all duration-500 ease-out"></div>
            </div>
        </div>

        <div id="questions-container" class="p-6 space-y-24 py-32">
            <!-- Vragen worden hier geladen -->
        </div>

        <div class="p-12 border-t border-gray-100 flex flex-col items-center bg-gray-50">
            <div id="validation-msg" class="text-red-600 mb-6 hidden font-bold text-lg bg-red-50 p-4 rounded-lg border border-red-100"></div>
            <button id="submit-btn" onclick="validateAndSubmit()" class="bg-green-600 hover:bg-green-700 text-white font-black py-4 px-16 rounded-full transition duration-300 shadow-xl text-xl uppercase tracking-wider transform hover:scale-105">
                Toets Inleveren
            </button>
        </div>
    </div>

    <!-- Resultaat Scherm -->
    <div id="result-screen" class="hidden p-12 text-center min-h-[400px] flex flex-col justify-center items-center">
        <div class="mb-6 text-7xl animate-bounce">🏆</div>
        <h2 class="text-4xl font-extrabold mb-4 text-gray-800">Bedankt, <span id="display-name" class="text-blue-600"></span>!</h2>
        <p class="text-xl text-gray-600 mb-8">Je toets is succesvol afgerond en opgeslagen.</p>
        <div class="bg-blue-600 p-8 rounded-2xl shadow-inner text-white">
            <p class="text-lg opacity-90 mb-1">Jouw resultaat:</p>
            <p id="final-score" class="text-5xl font-black">0 / 40</p>
        </div>
    </div>
</div>

<script>
const rawDatabase = [
    { q: "Fienes lievelingsfruit is mang...", instr: "Wat hoort op de lege plek?", type: "MC", options: ["o", "oo", "o's"], correct: "o", hint: "Denk aan de klinker aan het eind van een woord." },
    { q: "Ik ben altijd mijn ... kwijt. (sleutel)", instr: "Vul het meervoud in van het woord tussen haakjes.", type: "OPEN", correct: "sleutels", hint: "Het gaat om meer dan één sleutel." },
    { q: "Jim wordt vandaag a...t jaar.", instr: "Wat hoort op de lege plek?", type: "MC", options: ["ch", "gh", "gt"], correct: "ch", hint: "Lange klank + cht, behalve bij legt, zegt, ligt." },
    { q: "Mijn beste vriendin had veel baga...e meegenomen.", instr: "Vul het woord aan.", type: "OPEN", correct: "bagage", hint: "Het woord komt uit het Frans." },
    { q: "In de woestijn ligt een oa...e.", instr: "Vul het woord aan.", type: "OPEN", correct: "oase", hint: "Een vruchtbare plek in de woestijn." },
    { q: "Tijdens de regen schuilen we onder het viadu...t.", instr: "Wat hoort op de lege plek?", type: "OPEN", correct: "viaduct", hint: "Het eindigt op een harde klank." },
    { q: "Ik heb geen idee hoe dat ... heet. (hond)", instr: "Vul het verkleinwoord in van het woord tussen haakjes.", type: "OPEN", correct: "hondje", hint: "Maak het woord klein." },
    { q: "Dabir leest nu veel. Toen hij jonger was, ... hij vooral stripboeken. (lezen)", instr: "Vul de juiste vorm van het werkwoord in.", type: "OPEN", correct: "las", hint: "Gebruik de verleden tijd." },
    { q: "Er zijn te veel ... (mogelijkheid)", instr: "Meervoud van het woord tussen haakjes.", type: "OPEN", correct: "mogelijkheden", hint: "Meervoud van woorden op -heid is -heden." },
    { q: "Toine en Ilse ... van een baan in de muziek. (dromen)", instr: "Juiste vorm van het werkwoord.", type: "OPEN", correct: "dromen", hint: "Het onderwerp is meervoud." },
    { q: "Mijn zus is het meest ... van ons allemaal. (eigenwijs)", instr: "Overtreffende trap.", type: "OPEN", correct: "eigenwijs", hint: "Kies de juiste vorm." },
    { q: "Welke zin is juist?", instr: "Hoofdletters en interpunctie.", type: "MC", options: ["Daarna vroeg mijn moeder: \"Wat wil je eten?\"", "Daarna vroeg mijn moeder: \"wat wil je eten?\"", "daarna vroeg mijn moeder: \"Wat wil je eten?\""], correct: "Daarna vroeg mijn moeder: \"Wat wil je eten?\"", hint: "Een citaat begint met een hoofdletter." },
    { q: "De ... kinderen spelen buiten. (klein)", instr: "Bijvoeglijk naamwoord.", type: "OPEN", correct: "kleine", hint: "Verbuiging van klein." },
    { q: "De bakker ... elke ochtend vers brood. (bakken)", instr: "Tegenwoordige tijd.", type: "OPEN", correct: "bakt", hint: "Stam + t." },
    { q: "Wij ... gisteren naar de film. (gaan)", instr: "Verleden tijd meervoud.", type: "OPEN", correct: "gingen", hint: "Sterk werkwoord." },
    { q: "Het is een ... tafel. (hout)", instr: "Stoffelijk bijvoeglijk naamwoord.", type: "OPEN", correct: "houten", hint: "Eindigt op -en." },
    { q: "In de winter ... het vaak. (sneeuwen)", instr: "Tegenwoordige tijd.", type: "OPEN", correct: "sneeuwt", hint: "Stam + t." },
    { q: "De ... vliegen in de lucht. (bij)", instr: "Meervoud.", type: "OPEN", correct: "bijen", hint: "Meervoudsvorm." },
    { q: "Ik ... gisteren een appel. (eten)", instr: "Verleden tijd.", type: "OPEN", correct: "at", hint: "Sterk werkwoord." },
    { q: "De ... blaft naar de kat. (hond)", instr: "Wat blaft er?", type: "OPEN", correct: "hond", hint: "Het dier." },
    { q: "Er staan drie ... in de vaas. (bloem)", instr: "Meervoud.", type: "OPEN", correct: "bloemen", hint: "Meervoud." },
    { q: "Het ... kindje slaapt. (lief)", instr: "Bijvoeglijk naamwoord.", type: "OPEN", correct: "lieve", hint: "f wordt v." },
    { q: "Wij ... elke dag een appel. (eten)", instr: "Tegenwoordige tijd meervoud.", type: "OPEN", correct: "eten", hint: "Meervoud." },
    { q: "Gisteren ... de zon fel. (schijnen)", instr: "Verleden tijd.", type: "OPEN", correct: "scheen", hint: "Sterk werkwoord." },
    { q: "De ... rijden op de weg. (auto)", instr: "Meervoud.", type: "OPEN", correct: "auto's", hint: "Met apostrof s." },
    { q: "Ik ... mijn tanden elke dag. (poetsen)", instr: "Tegenwoordige tijd.", type: "OPEN", correct: "poets", hint: "Stam." },
    { q: "De weid...vogels vliegen laag.", instr: "Tussen-n of niet?", type: "MC", options: ["e", "en"], correct: "e", hint: "Uitzondering." },
    { q: "De meesters zitten in de lerar...kamer.", instr: "Tussen-n of niet?", type: "MC", options: ["e", "en"], correct: "en", hint: "Samenstelling." },
    { q: "Het ... huis staat te koop. (groot)", instr: "Bijvoeglijk naamwoord.", type: "OPEN", correct: "grote", hint: "Verbuiging." },
    { q: "Hij ... een glas water. (drinken)", instr: "Tegenwoordige tijd.", type: "OPEN", correct: "drinkt", hint: "Stam + t." },
    { q: "De ... zijn erg scherp. (mes)", instr: "Meervoud.", type: "OPEN", correct: "messen", hint: "Dubbele medeklinker." },
    { q: "Gisteren ... ik een cadeau. (krijgen)", instr: "Verleden tijd.", type: "OPEN", correct: "kreeg", hint: "Sterk werkwoord." },
    { q: "De ... zingen een lied. (vogel)", instr: "Meervoud.", type: "OPEN", correct: "vogels", hint: "Meervoud met s." },
    { q: "Ik ... een mooie tekening. (maken)", instr: "Tegenwoordige tijd.", type: "OPEN", correct: "maak", hint: "Stam." },
    { q: "De ... is erg hoog. (berg)", instr: "Wat is hoog?", type: "OPEN", correct: "berg", hint: "Enkelvoud." },
    { q: "Zij ... een appel. (eten)", instr: "Tegenwoordige tijd enkelvoud.", type: "OPEN", correct: "eet", hint: "Stam + t." },
    { q: "De ... vallen in de herfst. (blad)", instr: "Meervoud.", type: "OPEN", correct: "bladeren", hint: "Onregelmatig meervoud." },
    { q: "Hij ... de deur dicht. (doen)", instr: "Tegenwoordige tijd.", type: "OPEN", correct: "doet", hint: "Stam + t." },
    { q: "Het ... jongetje huilt. (arm)", instr: "Bijvoeglijk naamwoord.", type: "OPEN", correct: "arme", hint: "Verbuiging." },
    { q: "Wij ... in de tuin. (zitten)", instr: "Tegenwoordige tijd meervoud.", type: "OPEN", correct: "zitten", hint: "Meervoud." }
];

let selectedQuestions = [];
let userAnswers = {};
let questionStatus = {};
let attempts = {};
const TOTAL_QUESTIONS = 40;
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbzZhuEwPkor67-Eym2DK3AW2HO_rkQw72c2QR8VwHK9OlGCjay3rPM9a3NA9t1bubeG/exec";

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function startTest() {
    const name = document.getElementById('student-name').value.trim();
    if (!name) {
        alert("Vul eerst je naam in om te beginnen.");
        return;
    }
    selectedQuestions = shuffle([...rawDatabase]).slice(0, TOTAL_QUESTIONS);
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    renderQuestions();
    
    // Start bij de eerste vraag
    setTimeout(() => {
        const firstCard = document.getElementById('q-card-0');
        firstCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        document.getElementById('input-0')?.focus();
    }, 300);
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    selectedQuestions.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = "question-card bg-white p-8 border-2 border-blue-50 rounded-2xl shadow-lg transform transition-all duration-500 max-w-2xl mx-auto";
        card.id = `q-card-${index}`;

        let html = `<div class="flex items-center gap-3 mb-6">
                        <span class="bg-blue-600 text-white w-10 h-10 flex items-center justify-center rounded-full text-lg font-black shadow-md">${index + 1}</span>
                        <p class="text-sm font-bold text-gray-400 uppercase tracking-widest">${q.instr}</p>
                    </div>
                    <p class="text-2xl text-gray-800 mb-8 leading-relaxed font-semibold">${q.q}</p>`;

        if (q.type === "MC") {
            html += `<div class="grid grid-cols-1 gap-4">`;
            q.options.forEach(opt => {
                html += `<button onclick="handleAnswer(${index}, '${opt}')" 
                           id="opt-${index}-${opt.replace(/[^a-zA-Z0-9]/g, "")}"
                           class="answer-opt text-left p-4 border-2 border-gray-100 rounded-xl hover:bg-blue-50 hover:border-blue-300 transition-all font-bold text-lg outline-none">
                           ${opt}
                         </button>`;
            });
            html += `</div>`;
        } else {
            html += `<div class="space-y-4">
                        <input type="text" 
                            id="input-${index}"
                            autocomplete="off"
                            placeholder="Typ je antwoord..."
                            onkeydown="if(event.key === 'Enter') { event.preventDefault(); handleAnswer(${index}, this.value); }"
                            class="w-full p-5 border-2 border-gray-100 rounded-xl focus:outline-none text-xl font-bold transition-all text-center">
                        <button onclick="handleAnswer(${index}, document.getElementById('input-${index}').value)"
                            id="check-btn-${index}"
                            class="w-full bg-blue-100 text-blue-700 py-3 rounded-xl font-black hover:bg-blue-600 hover:text-white transition-all uppercase tracking-widest">
                            Controleer
                        </button>
                    </div>`;
        }

        html += `<div id="hint-${index}" class="hint-box mt-6 p-4 bg-yellow-50 text-yellow-800 rounded-xl border-l-4 border-yellow-400 hidden text-sm">
                    <strong>Hulp:</strong> ${q.hint}
                 </div>`;
        
        card.innerHTML = html;
        container.appendChild(card);
    });
}

function handleAnswer(qIndex, val) {
    if (questionStatus[qIndex]) return;

    const question = selectedQuestions[qIndex];
    const userVal = val.trim();
    const normalizedUser = userVal.toLowerCase();
    const normalizedCorrect = question.correct.toLowerCase();

    if (normalizedUser === normalizedCorrect && userVal !== "") {
        userAnswers[qIndex] = userVal;
        questionStatus[qIndex] = 'Correct';
        markAsAnswered(qIndex, true);
        updateUI(qIndex);
        setTimeout(() => focusNextQuestion(qIndex), 600);
    } else if (userVal !== "") {
        attempts[qIndex] = (attempts[qIndex] || 0) + 1;
        
        if (attempts[qIndex] === 1) {
            document.getElementById(`hint-${qIndex}`).classList.remove('hidden');
            const el = document.getElementById(`input-${qIndex}`);
            if (el) {
                el.classList.add('border-orange-400');
                setTimeout(() => el.classList.remove('border-orange-400'), 1000);
            }
        } else if (attempts[qIndex] >= 2) {
            userAnswers[qIndex] = userVal;
            questionStatus[qIndex] = 'Fout';
            autoFillCorrect(qIndex, question.correct);
            updateUI(qIndex);
            setTimeout(() => focusNextQuestion(qIndex), 1000);
        }
    }
}

function focusNextQuestion(currentIndex) {
    const nextIndex = currentIndex + 1;
    if (nextIndex < TOTAL_QUESTIONS) {
        const nextCard = document.getElementById(`q-card-${nextIndex}`);
        if (nextCard) {
            // Soepele verticale centrering
            nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Focus op het invoerveld
            setTimeout(() => {
                const input = document.getElementById(`input-${nextIndex}`);
                if (input) input.focus();
            }, 500);
        }
    } else {
        document.getElementById('submit-btn').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

function markAsAnswered(index, isCorrect) {
    const card = document.getElementById(`q-card-${index}`);
    card.classList.remove('border-blue-50');
    
    if (isCorrect) {
        card.classList.add('border-green-500', 'bg-green-50', 'shadow-green-100');
    } else {
        card.classList.add('border-red-500', 'bg-red-50', 'shadow-red-100');
    }
    
    const elements = card.querySelectorAll('input, button');
    elements.forEach(el => el.disabled = true);
    
    const checkBtn = document.getElementById(`check-btn-${index}`);
    if (checkBtn) {
        checkBtn.innerText = isCorrect ? "GOED" : "FOUT";
        checkBtn.className = isCorrect 
            ? "w-full bg-green-500 text-white py-3 rounded-xl font-black uppercase tracking-widest" 
            : "w-full bg-red-500 text-white py-3 rounded-xl font-black uppercase tracking-widest";
    }
}

function autoFillCorrect(index, correctVal) {
    const card = document.getElementById(`q-card-${index}`);
    const input = document.getElementById(`input-${index}`);
    
    if (input) {
        input.classList.add('wrong-answer-fill');
        const feedback = document.createElement('div');
        feedback.className = "mt-4 text-green-700 font-black text-center bg-white p-3 rounded-lg border-2 border-green-200 animate-pulse";
        feedback.innerText = `JUISTE ANTWOORD: ${correctVal}`;
        input.parentElement.appendChild(feedback);
    } else {
        const buttons = card.querySelectorAll('.answer-opt');
        buttons.forEach(btn => {
            if (btn.innerText === correctVal) {
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'scale-105');
            } else {
                btn.classList.add('opacity-30', 'grayscale');
            }
        });
    }
    markAsAnswered(index, false);
}

function updateUI(qIndex) {
    const count = Object.keys(questionStatus).length;
    const perc = (count / TOTAL_QUESTIONS) * 100;
    document.getElementById('progress-bar').style.width = perc + '%';
    document.getElementById('progress-text').innerText = `${count} / ${TOTAL_QUESTIONS}`;
}

function calculateScore() {
    return Object.values(questionStatus).filter(s => s === 'Correct').length;
}

function validateAndSubmit() {
    const answered = Object.keys(questionStatus).length;
    if (answered < TOTAL_QUESTIONS) {
        const msg = document.getElementById('validation-msg');
        msg.innerText = `Je hebt nog niet alle vragen beantwoord (${answered}/${TOTAL_QUESTIONS}). Maak de toets eerst af.`;
        msg.classList.remove('hidden');
        msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
    }
    submitToSheets();
}

async function submitToSheets() {
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerText = "BEZIG MET OPSLAAN...";
    
    const studentName = document.getElementById('student-name').value;
    const scoreValue = calculateScore();
    
    const report = selectedQuestions.map((q, i) => {
        return `V${i+1}: ${questionStatus[i]} (${userAnswers[i] || '-'})`;
    }).join(' | ');

    const data = {
        naam: studentName,
        datum: new Date().toLocaleString(),
        score: `${scoreValue}/${TOTAL_QUESTIONS}`,
        details: report
    };

    try {
        await fetch(SHEETS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        showFinalResults(scoreValue);
    } catch (e) {
        showFinalResults(scoreValue);
    }
}

function showFinalResults(score) {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('display-name').innerText = document.getElementById('student-name').value;
    document.getElementById('final-score').innerText = `${score} / ${TOTAL_QUESTIONS}`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IEP Oefentoets Taalverzorging</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.3s ease; }
        .option-btn { border: 2px solid #e5e7eb; transition: all 0.2s; cursor: pointer; text-align: left; width: 100%; padding: 0.75rem; border-radius: 0.5rem; }
        .option-btn:hover:not(.disabled) { border-color: #3b82f6; background-color: #eff6ff; }
        .correct { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46; font-weight: bold; }
        .incorrect { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        .hint-text { color: #1e40af; background-color: #eff6ff; border-left: 4px solid #3b82f6; }
        .disabled { cursor: default; opacity: 0.7; }
        input[type="text"] { border: 2px solid #e5e7eb; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #3b82f6; }
        .instruction { color: #4b5563; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.025em; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <!-- Login Sectie -->
        <div id="login-container" class="card p-8 text-center">
            <h1 class="text-3xl font-bold text-blue-800 mb-4">Start Toets</h1>
            <p class="text-gray-600 mb-6">Vul je naam in om de toets te beginnen.</p>
            <input type="text" id="student-name" class="p-3 rounded-lg border-2 w-full max-w-sm mb-4" placeholder="Voor- en achternaam">
            <br>
            <button id="start-btn" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 font-bold transition">Begin de Toets</button>
        </div>

        <!-- Quiz Sectie -->
        <div id="quiz-ui" class="hidden">
            <header class="mb-8 text-center">
                <h1 class="text-3xl font-bold text-blue-800">Oefentoets Taalverzorging (IEP)</h1>
                <p class="text-gray-600 mt-2">Succes, <span id="display-name" class="font-bold text-blue-600"></span>!</p>
                <div class="mt-4 bg-blue-100 text-blue-800 py-2 px-4 rounded-full inline-block font-semibold">
                    Beantwoord: <span id="progress">0</span> / <span id="total-questions"></span>
                </div>
            </header>
            <div id="quiz-container"></div>
        </div>

        <!-- Resultaat Sectie -->
        <div id="final-result" class="hidden card p-8 text-center">
            <h2 class="text-2xl font-bold mb-4">Toets Voltooid!</h2>
            <div id="submitting-status" class="mb-4">
                <div class="spinner"></div> Resultaten opsturen naar de meester/juf...
            </div>
            <p class="text-lg mb-4" id="final-score-text"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">Opnieuw beginnen</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATIE VOOR DOCENT ---
        // Jouw persoonlijke Google Apps Script Web App URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxP4iDF01KeuBYOifU6hhz5SZm7udTKuZanXcOD0FPYYXnaxnxfuXDLvtYyOClkockF/exec"; 

        const originalQuizData = [
            { type: "open", instr: "Vul het meervoud in van het woord tussen haakjes.", q: "Wij hadden op vakantie veel last van (mug).", correct: "muggen", hint: "Verdubbel de medeklinker bij een korte klank." },
            { type: "open", instr: "Vul de goede vorm in van het woord tussen haakjes. Gebruik de tegenwoordige tijd.", q: "Stefan en Nicole (bakken) vanmiddag een appeltaart voor hun vrienden.", correct: "bakken", hint: "Het onderwerp is meervoud (zij)." },
            { type: "multiple-choice", instr: "In welke zin staan de aanhalingstekens op de goede plek?", q: "Kies de juiste zin:", options: ["David zegt: \"Kom mee\", we gaan naar het pleintje!", "\"David zegt: Kom mee, we gaan naar het pleintje!\"", "David zegt: \"Kom mee, we gaan naar het pleintje!\"", "\"David zegt\": Kom mee, we gaan naar het pleintje!"], correct: "David zegt: \"Kom mee, we gaan naar het pleintje!\"", hint: "Alleen de gesproken woorden staan tussen aanhalingstekens." },
            { type: "open", instr: "Vul de goede vorm in van het woord tussen haakjes.", q: "Dat was een (gemist) kans voor de voetballer.", correct: "gemiste", hint: "Voeg een -e toe aan het bijvoeglijk naamwoord." },
            { type: "open", instr: "Vul het meervoud in van het woord tussen haakjes.", q: "De dierenambulance heeft vorige week drie (gans) gered.", correct: "ganzen", hint: "De 's' verandert in een 'z'." },
            { type: "open", instr: "Vul het meervoud in van het woord tussen haakjes.", q: "Mijn ouders bezoeken op vakantie alleen maar (museum).", correct: "musea", hint: "Dit is een Latijns meervoud (of 'museums').", altCorrect: "museums" },
            { type: "open", instr: "Vul de goede vorm in van het werkwoord tussen haakjes.", q: "Ik heb mijn knie (schaven) toen ik in de boom klom.", correct: "geschaafd", hint: "Kijk naar de stam 'schaav-'. De 'v' zit niet in 't kofschip." },
            { type: "multiple-choice", instr: "In welke zin zijn de hoofdletters goed gebruikt?", q: "Kies de juiste zin:", options: ["\"Waar is dierentuin Artis?\" vroeg ik aan de man. Hij antwoordde: \"midden in Amsterdam.\"", "\"Waar is dierentuin Artis?\" vroeg ik aan de man. Hij antwoordde: \"Midden in Amsterdam.\"", "\"Waar is Dierentuin Artis?\" vroeg ik aan de man. Hij antwoordde: \"midden in Amsterdam.\"", "\"Waar is Dierentuin Artis?\" vroeg ik aan de man. Hij antwoordde: \"Midden in Amsterdam.\""], correct: "\"Waar is dierentuin Artis?\" vroeg ik aan de man. Hij antwoordde: \"Midden in Amsterdam.\"", hint: "Zin begint altijd met een hoofdletter, ook na een dubbele punt in een citaat." },
            { type: "open", instr: "Vul de goede vorm in van het woord tussen haakjes.", q: "Annebel heeft een (fluweel) jurk aan.", correct: "fluwelen", hint: "Stoffelijke bijvoeglijk naamwoorden eindigen op -en." },
            { type: "open", instr: "Vul de goede vorm in van het werkwoord tussen haakjes. Gebruik de verleden tijd.", q: "Vroeger (haten) ik gymles, maar nu vind ik het best leuk.", correct: "haatte", hint: "De stam eindigt op een 't', dus dubbel 'tt' in de verleden tijd." },
            { type: "open", instr: "Vul het verkleinwoord in van het woord tussen haakjes.", q: "Pas op! Dat (paprika) is eigenlijk een superscherpe peper.", correct: "paprikaatje", hint: "Let op de spelling van de lange klank." },
            { type: "open", instr: "Vul de goede vorm in van het werkwoord tussen haakjes. Gebruik de tegenwoordige tijd.", q: "Als je de bal nog een keer zo hard (gooien), stop ik met spelen!", correct: "gooit", hint: "Onderwerp is 'je' (stam + t)." },
            { type: "open", instr: "Vul de goede vorm in van het werkwoord tussen haakjes. Gebruik de tegenwoordige tijd.", q: "Je (raden) het goede antwoord nooit!", correct: "raadt", hint: "Stam (raad) + t." },
            { type: "open", instr: "Vul het meervoud in van het woord tussen haakjes.", q: "In het noorden leeft een groep (orka).", correct: "orka's", hint: "Gebruik een apostrof bij woorden op -a." },
            { type: "open", instr: "Vul de goede vorm in van het werkwoord tussen haakjes. Gebruik de verleden tijd.", q: "Tobias (reageren) verbaasd op de vraag van zijn moeder.", correct: "reageerde", hint: "Stam eindigt niet op een kofschip-letter." }
        ];

        let currentScore = 0;
        let answeredQuestions = 0;
        let quizData = [];
        let attempts = {};
        let studentName = "";
        let errorLog = [];

        document.getElementById('total-questions').innerText = originalQuizData.length;

        document.getElementById('start-btn').onclick = () => {
            const name = document.getElementById('student-name').value.trim();
            if (name.length < 3) {
                alert("Vul je volledige naam in.");
                return;
            }
            studentName = name;
            document.getElementById('display-name').innerText = name;
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('quiz-ui').classList.remove('hidden');
            initQuiz();
        };

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            quizData = [...originalQuizData];

            quizData.forEach((item, index) => {
                attempts[index] = 0;
                const card = document.createElement('div');
                card.className = 'card p-6 mb-6';
                
                let inputHtml = item.type === "multiple-choice" ? `
                    <div class="grid grid-cols-1 gap-3" id="q${index}-inputs">
                        ${item.options.map((opt, i) => `<button onclick="checkMC(${index}, ${i})" id="q${index}-btn${i}" class="option-btn bg-white border-2 border-gray-200">${opt}</button>`).join('')}
                    </div>` : `
                    <div id="q${index}-inputs" class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="q${index}-text" class="p-3 rounded-lg flex-grow border-2" placeholder="Antwoord...">
                        <button onclick="checkOpen(${index})" id="q${index}-submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-bold">Check</button>
                    </div>`;

                card.innerHTML = `<div class="instruction">${item.instr}</div><p class="font-bold text-lg mb-4">${index + 1}. ${item.q}</p>${inputHtml}<div id="q${index}-hint" class="hint-text mt-4 p-3 rounded hidden"><strong>Tip:</strong> ${item.hint}</div>`;
                container.appendChild(card);
            });
        }

        window.checkMC = (qIdx, oIdx) => {
            const item = quizData[qIdx];
            handleResult(qIdx, item.options[oIdx] === item.correct, oIdx, item.options[oIdx]);
        };

        window.checkOpen = (qIdx) => {
            const val = document.getElementById(`q${qIdx}-text`).value.trim();
            const isCorrect = val.toLowerCase() === quizData[qIdx].correct.toLowerCase() || 
                             (quizData[qIdx].altCorrect && val.toLowerCase() === quizData[qIdx].altCorrect.toLowerCase());
            handleResult(qIdx, isCorrect, null, val);
        };

        function handleResult(qIndex, isCorrect, optIdx, val) {
            const container = document.getElementById(`q${qIndex}-inputs`);
            if (container.classList.contains('finalized')) return;

            attempts[qIndex]++;
            if (!isCorrect) {
                if (attempts[qIndex] === 1) {
                    if (optIdx !== null) document.getElementById(`q${qIndex}-btn${optIdx}`).classList.add('incorrect', 'disabled');
                    else document.getElementById(`q${qIndex}-text`).classList.add('incorrect');
                    document.getElementById(`q${qIndex}-hint`).classList.remove('hidden');
                    return;
                }
                errorLog.push({ vraag: qIndex + 1, ingevuld: val, correct: quizData[qIndex].correct });
            } else {
                if (attempts[qIndex] === 1) currentScore++;
            }

            // Finaliseer de vraag
            container.classList.add('finalized');
            if (optIdx !== null) {
                const buttons = container.querySelectorAll('button');
                buttons.forEach(btn => btn.classList.add('disabled'));
                const correctIdx = quizData[qIndex].options.indexOf(quizData[qIndex].correct);
                document.getElementById(`q${qIndex}-btn${correctIdx}`).classList.add('correct');
                if (!isCorrect) document.getElementById(`q${qIndex}-btn${optIdx}`).classList.add('incorrect');
            } else {
                const input = document.getElementById(`q${qIndex}-text`);
                const btn = document.getElementById(`q${qIndex}-submit`);
                input.disabled = true;
                btn.disabled = true;
                btn.classList.add('opacity-50');
                input.value = quizData[qIndex].correct;
                input.classList.add('correct');
            }

            document.getElementById(`q${qIndex}-hint`).classList.add('hidden');
            answeredQuestions++;
            document.getElementById('progress').innerText = answeredQuestions;
            if (answeredQuestions === quizData.length) finishQuiz();
        }

        async function finishQuiz() {
            window.scrollTo(0,0);
            document.getElementById('quiz-ui').classList.add('hidden');
            document.getElementById('final-result').classList.remove('hidden');
            document.getElementById('final-score-text').innerText = `Je hebt ${currentScore} van de ${quizData.length} vragen in één keer goed beantwoord!`;
            
            const payload = {
                naam: studentName,
                score: currentScore,
                fouten: JSON.stringify(errorLog),
                datum: new Date().toLocaleString()
            };

            if (SCRIPT_URL) {
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify(payload)
                    });
                    document.getElementById('submitting-status').innerHTML = "✅ Je resultaten zijn opgeslagen in de lijst van de meester/juf.";
                } catch (e) {
                    document.getElementById('submitting-status').innerHTML = "⚠️ Kon niet opslaan. Maak een foto van je score.";
                }
            } else {
                document.getElementById('submitting-status').innerHTML = "ℹ️ Resultaten niet online opgeslagen (geen URL).";
            }
        }
    </script>
</body>
</html>
